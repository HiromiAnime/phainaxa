<p>Ahora Anaxágoras estaba realmente molesto. Volvió un poco la cabeza para amonestarlo: "No puedes estar pensando seriamente en eso en este momento".</p>
<p>Así fue como empezaron. Caos y desorden.</p>
<p>Por la noche, Anaxágoras descubrió que toda la Arboleda de la Epifanía había sido infestada de criaturas corrompidas que tampoco parecían originarse en la Marea Negra.</p>
<p>No se sorprendió cuando Phainon le contó todo. Había previsto que la Arboleda se encontraría en una situación tan catastrófica, considerando lo aislados que estaban, aunque sus orígenes poco claros despertaron su interés. Cuando se le preguntó, el Libertador tampoco dijo mucho. Desconocido.</p>
<p>En la biblioteca, Phainon dejó su espada en el suelo. El acero sucio y manchado de sangre reflejaba la figura de la novia Anaxágoras, la tela blanca de su esbelta figura ligeramente manchada con nieblas de sangre aquí y allá. Phainon había matado implacablemente a las bestias que se interponían en su camino, protegiendo a su 'Anaxa' de la mayor parte del daño.</p>
<p>Cuando el pensamiento cruzó su mente una vez más, el joven se volvió hacia su novia, con la anticipación y la ansiedad pintadas en el rostro.</p>
<p>Phainon estaba tan extasiado que se le quebró la voz al preguntar: "Entonces, profesor Anaxa..."</p>
<p>Una mirada afilada como un cuchillo se dirigió hacia él.</p>
<p>"...goras. En aquel entonces, ¿realmente dijiste que sí? A mí... bueno, ¿a casarte conmigo...?"</p>
<p>"Eres demasiado joven para este asunto. No creo que entiendas lo que estás pidiendo".</p>
<p>"No, sé lo que te estoy pidiendo. Yo... realmente te amo. Realmente me gustaste. Así que te estoy preguntando si me darías la oportunidad de mostrarte..."</p>
<p>Phainon sabía que cualquier otra persona, enfrentada a una situación así, se burlaría de ello. Después de todo, la idea de que tu estudiante que se graduó hace algún tiempo regrese solo para de repente proclamar sus sentimientos y proponerte matrimonio, era normal encontrarlo absurdo.</p>
<p>Sin embargo, las pestañas de Anaxágoras temblaron mientras miraba hacia abajo. Contemplación, o una emoción más compleja.</p>
<p>El piso estaba mugriento.</p>
<p>"Dame algo de tiempo", fue todo lo que dijo al respecto.</p>
<p>O darte algo de tiempo. Y darte cuenta de que en realidad no dices en serio todo lo que dijiste.</p>
<p>Su día continuo fue menos indulgente, y el éxtasis del novio se disipó lentamente. Las preguntas de la novia se amontonaban lentamente. Aún había consuelo, había lo que parecía amor, incluso si Phainon no había obtenido sus respuestas todavía.</p>
<p>Solo después de que el estómago de Phainon gruñera, Anaxágoras se dio cuenta de que no habían comido nada desde ayer.</p>
<p>El suministro de alimentos en la Arboleda había sido devastado. Al menos el agua se libró limpia.</p>
<p>Al principio, propuso limpiar un monstruo asesinado y cocinar la carne de él. Un enfoque sensato.</p>
<p>Sin embargo, no esperaba que el joven que generalmente era brillante todo el tiempo incluso hasta ayer, hiciera una mueca ante esta idea.</p>
<p>"¿Nunca supe que eras un comedor quisquilloso?", se burló la novia.</p>
<p>"No... Es solo que, no creo que soportaría algo tan sombrío", el novio se frotó el cuello.</p>
<p>Terminaron comiendo frugalmente, buscando con cuidado hongos comestibles junto al camino.</p>
<p>"¿A dónde vamos?", preguntó Anaxágoras, cuando Phainon estaba masticando lentamente los hongos, saboreando la rúsula que el profesor acababa de recoger para él.</p>
<p>Phainon siguió masticando durante un rato, y cuando Anaxágoras pensó que no había preguntado lo suficientemente alto, escuchó: "... Okhema".</p>
<p>Sonó cuidadoso. Aprensivo. Un poco de duda, incluso.</p>
<p>Antes de que Anaxágoras pudiera oponerse, respondió de inmediato: "Anaxa, sé que no te gusta Okhema... Pero la mayoría de los eruditos de la Arboleda, están... a salvo, allí. Es la única ciudad a la que podemos evacuar por ahora, hasta que descubramos la fuente de esta calamidad".</p>
<p>"¿Ni siquiera Castrum Kremnos pudo resistir esto?", preguntó Anaxágoras con leve incredulidad.</p>
<p>Phainon sólo frunció el ceño, evitando su mirada.</p>
<p>Se sentía un poco mal. Pero Anaxágoras confiaba en él.</p>
<p>Después de un incómodo período de silencio, Phainon abrió la boca de nuevo y preguntó: "Oye... Aún no has terminado tu primero".</p>
<p>Anaxágoras bajó la mirada hacia los pequeños hongos que tenía entre las manos. Apenas mordidos. Mordisqueados, incluso.</p>
<p>"No tengo hambre".</p>
<p>Cuando Phainon se fue a despejar el camino para escapar, Anaxágoras miró alrededor de la biblioteca para esperar su regreso.</p>
<p>El Libertador se había negado a llevarlo, preocupado por los peligros que había allí afuera y por el hecho de que la novia había estado caminando con tacones altos.</p>
<p>Anaxágoras se sintió un poco letárgico entonces, así que no puso ninguna objeción y dejó que Phainon se marchara a buscar.</p>
<p>Una calma en medio de la tormenta. Un tiempo de paz para ordenar su mente. No hay amenaza de daño que lo perturbe, ni súplicas de atención de su entonces estudiante y ahora futuro esposo.</p>
<p>Sacudiéndose la suciedad de su vestido de novia, algo desgastado, se levantó de su lugar de descanso y miró alrededor de la biblioteca en busca de lo que pudiera responder al misterio de estas criaturas.</p>
<p>Caminó por las columnas de estanterías, examinó filas de libros y tesis encuadernadas. Nada. Papeles sin sentido de la escuela de Caprist. Libros de romance introducidos de contrabando por los estudiantes. ¡Qué sinvergüenzas!</p>
<p>Sus ojos hojeaban páginas, títulos. Ninguno encajaba con estas descripciones. Estaba a punto de pasar al siguiente estante, sin embargo, sus ojos se detuvieron en algo intrigante.</p>
<p>Desentrañando el Nousporismo a través de Experimentos de Parapsicología. Compilado por Hyacinthia del Patio del Crepúsculo.</p>
<p>¿Cómo consiguió esos registros? Y, lo que es más importante, ¿cómo se las arregló para publicarlos ante los ojos de gente tan santurrona como los Venerationistas?</p>
<p>El sabio se interesó en leer y, así, hojeó las páginas, leyó el índice, que enumeraba muchos de sus propios registros, pero algo lo detuvo.</p>
<p>La página de dedicación decía: En memoria del difunto sabio Nousporista Anaxágoras, mi antiguo mentor.</p>
<p>En memoria del difunto Anaxágoras...</p>
<p>Su... antiguo mentor.</p>
<p>Hyacine no sería el tipo de persona que hace esas bromas pesadas, ¿o sí?</p>
<p>¿No había hablado con ella hacía dos días sobre los calendarios de exámenes y todo eso? Espera...</p>
<p>Sus dedos trazaron inconscientemente aquellas pocas pero mortificantes palabras.</p>
<p>Un pensamiento se le cruzó por la mente. Realmente no podía recordar las cosas en un orden cronológico claro. ¿Esa conversación ocurrió hace dos días, o sucedió en otro momento? ¿Qué había sucedido antes de que se despertara con Phainon?</p>
<p>Destellos de recuerdos se iluminaban vagamente dentro de su mente, pero ninguno de ellos parecía tener sentido con la línea de tiempo tampoco.</p>
<p>Y mientras Anaxágoras pensaba en una idea para comprobar si había registros del Decreto del Sabio, se sobresaltó por un chillido espeluznante y se dio vuelta para encontrarse con una fea criatura saltando hacia él.</p>
<p>Phainon regresó esa noche. La sangre le manchaba la cara, aunque afortunadamente era carmesí. Sus pasos eran pesados por el cansancio, y sus pies se arrastraban por el suelo de madera. Pero aun así, cuando vio a su encantador profesor en el suelo leyendo, sus labios se curvaron en una tierna sonrisa mientras se encorvaba para sentarse a su lado.</p>
<p>"¿Qué estás leyendo, Anaxa?", preguntó con inocencia, a pesar de que podría haber echado un vistazo al contenido para saber de inmediato de qué se trataba. Sólo quería escuchar la voz de su novia una vez más. Aspirar el aroma del cabello color menta de su novia, que se deslizaba por las curvas de su espalda descubiertas por las telas del vestido. Dejar que el sabio lo curara de esa dolencia que ellos llamaban cansancio.</p>
<p>'Anaxa' se quedó quieto por un momento. Luego, murmuró molesto, "... No 'Anaxa', y es solo un libro que los estudiantes colaron en los estantes", mientras cerraba el libro polvoriento y lo dejaba a un lado. Se volvió para mirar bien a Phainon, quien lo había estado mirando afectuosamente por un tiempo. "¿Cómo estaban las cosas allí afuera?"</p>
<p>Phainon suspiró, pasándose la mano por el cabello. "Terribles", fue todo lo que dijo al respecto. "He encontrado un camino que podría sacarnos de aquí sin meternos en muchos problemas, a través de la salida de emergencia de la escuela Venerationist".</p>
<p>"¿A través de la escuela Venerationist? ¿Aunque haya otras rutas de emergencia más cerca de aquí?"</p>
<p>"Mhm", asintió Phainon. "Casi no merodean por allí. A este paso podemos llegar a Okhema mañana por la noche".</p>
<p>Anaxágoras tarareó. Después de un rato, se cambió para sentarse directamente frente a Phainon, con un semblante que se volvió serio. "Phainon, necesito que me respondas algo", preguntó.</p>
<p>El libertador, un poco sorprendido por el cambio de actitud y, por tanto, sintiéndose ansioso, también ajustó su posición. Sonaba importante. Tenía un presentimiento.</p>
<p>"¿Sobre qué?"</p>
<p>"La noche que me encontraste, ¿qué estaba haciendo? ¿Y cómo es que llevamos puesto todo esto?"</p>
<p>Phainon, al recibir la pregunta, desvió su mirada hacia el vestido que llevaba puesto Anaxágoras. Seda ligeramente rota, raso un poco deshilachado en los bordes, rociadas y salpicaduras de color carmesí en la turbia tela blanca lo hacían lucir tan etéreo. Tan fantasmal.</p>
<p>Era inevitable que Anaxágoras empezara a cuestionar estas cosas. Phainon lo sabía.</p>
<p>Así que respondió en voz baja y melancólica: "Es una historia larga. De verdad, de verdad, una historia muy larga. No puedo decírtelo, lo siento..."</p>
<p>El profesor estaba confundido. Su cabeza se inclinó hacia un lado inconscientemente, haciéndolo lucir adorablemente lindo a pesar de que estaba muy serio en ese momento. "¿Qué quieres decir?", insistió.</p>
<p>Phainon todavía no soportaba mirarlo a los ojos.</p>
<p>"Cuando lleguemos a Okhema, te contaré todo, ¿de acuerdo? Te lo prometo. Pero de verdad no te puedo decir qué pasó ahora mismo".</p>
<p>Anaxágoras se quedó en silencio.</p>
<p>"Por favor, confía en mí...", suplicó. Temía que Anaxágoras, su 'Anaxa', se enojara por esta respuesta, lo dejara en ese pozo de desesperación, no lo perdonara por esa transgresión. Estaba verdadera y profundamente asustado.</p>
<p>Tal vez se había equivocado, tal vez había visto mal, pero Anaxágoras parecía percibir un destello de desesperación en Phainon. Sabía que Phainon era del tipo juguetón, tonto y entrañablemente travieso, pero nunca había visto esta versión de Phainon frente a él.</p>
<p>Tal vez tuviera sus propias buenas razones para decir eso, pensó Anaxágoras. Confiaba en Phainon. Realmente quería hacerlo. Por supuesto, el Romance siempre es la propia debilidad de la Razón, después de todo. Mnestia siempre llega a Cerces. Por lo tanto...</p>
<p>"Confío en ti", murmuró, y extendió la mano derecha para acariciar el cabello de Phainon. Sin embargo, estaba sentado demasiado lejos, y por eso se arrastró torpemente hacia el lado del novio, y lo que comenzó como una caricia se convirtió en un acunamiento cuando Phainon cedió y se acurrucó contra él, con los brazos envueltos alrededor de su delgada cintura, aspirando su aroma. "Pero tendrás que cumplir tu promesa cuando lleguemos a Okhema".</p>
<p>"Mm", asintió Phainon, con su rostro aliviado y relajado al darse cuenta de que su novia confiaba en él. Se quedaron así un rato y cuando empezó a sentirse somnoliento, preguntó: "Entonces profesor... ¿puedo preguntarle algo?"</p>
<p>Anaxágoras tarareó.</p>
<p>"¿Tú, te gusto? Quiero decir, te obligué a casarte, así que si no te gusto, entonces está bien, podemos cancelarlo cuando lleguemos a Okhema...", divagó.</p>
<p>"Pero por favor no me odies".</p>
<p>Su súplica fue en voz baja, y de alguna manera se arrepintió de lo que había dicho después de darse cuenta de lo terriblemente humillante que sonaba, pero antes de que pudiera retractarse de esas palabras, sintió un cambio de posición y el roce de sus mechones de cabello blanco.</p>
<p>Entonces lo sintió. Un beso en la frente. Anaxágoras lo había besado en la sien.</p>
<p>"Tonto. Nunca dije que no. Solo necesitaba algo de tiempo, eso es todo".</p>
<p>Un poco de tiempo para ponerlos en palabras de forma adecuada.</p>
<p>"Eso está bien entonces, estoy tan feliz. Estoy tan, tan feliz. Mañana, quiero contarte un pequeño secreto...", bostezó vertiginosamente el Libertador y empujó suavemente al otro hombre a recostarse en el suelo bajo su abrazo. Anaxágoras hizo lo mismo.</p>
<p>"Buenas noches, Anaxa", dijo, mientras levantaba el velo de su amante y le daba un beso en la frente.</p>
<p>Anaxágoras se despertó con el sonido de sollozos. Sus ojos parpadearon y se abrieron para ver a Phainon, cuyo traje a estas alturas ya estaba flojo y sucio, llorando frente a él.</p>
<p>Desconcertante. Anaxa intentó sentarse, para preguntar qué había pasado, pero sintió todo su cuerpo algo rígido y difícil de mover a su antojo. Solo pudo graznar, "Phai..."</p>
<p>Phainon, por otro lado, al darse cuenta de que su profesor había despertado, se frotó los ojos y se secó las lágrimas desordenadamente, en un intento desesperado por recuperar la compostura.</p>
<p>"Anaxa... Vi el cadáver... detrás de los estantes esta mañana".</p>
<p>¿De verdad? ¿El monstruo que intentó emboscarlo? ¿Estaba llorando por eso?</p>
<p>"Tú lo mataste, ¿no? Ayer, cuando estabas solo. Cuando te dejé", continuó Phainon con voz temblorosa.</p>
<p>Anaxágoras estaba confundido, ¿por qué iba el joven a llorar por ello? ¿No era acaso una amenaza? ¿No se suponía que debía eliminarla?</p>
<p>Intentó incorporarse, pero descubrió que le resultaba muy difícil con sus miembros entumecidos, por lo que pidió: "Phainon, ayúdame a sentarme".</p>
<p>Phainon se apresuró a su lado, lo levantó y lo apoyó en un estante cercano. Sus lágrimas seguían rodando por su mejilla, humedeciendo los guantes de Anaxágoras aquí y allá. Una incluso goteó sobre sus hombros, tibia en contraste con su piel fría. Se veía entrañablemente tonto. Las caras tontas siempre habían sido la especialidad de Phainon de todos modos, ya fuera para rogar por notas extras o para que el profesor pasara por alto sus travesuras.</p>
<p>Pero su forma de hablar carecía de ese encanto juvenil. En todo caso, sonaba cansado.</p>
<p>"Te estás poniendo cada vez más frío...", murmuró, secándose las lágrimas y los mocos del rostro con el brazo derecho. Luego, comenzó a frotarse repetidamente contra las palmas de las manos del hombre de cabello color menta, tratando de calentarlas en un intento patético.</p>
<p>"Lo siento, ni siquiera pude protegerte con mis propias manos. Incluso en esto he fracasado... Qué clase de esposo soy..." Anaxágoras se sorprendió en un principio por lo vaga que había sido la forma en que hablaba el otro. Pero al cabo de un tiempo se dio cuenta de lo que realmente significaba y suspiró, con el ojo medio cerrado de ternura.</p>
<p>"Estás siendo infantil", le regañó la novia, "te preocupas demasiado por mí. Yo puedo encargarme de ellos tanto como tú".</p>
<p>Phainon solo hizo un puchero ante esta respuesta, sabiendo que si continuaba, su Anaxa continuaría con otro sermón. Luego se acercó a los brazos del otro, masajeándolos bajo el supuesto de que Anaxágoras había dormido incómodo el día anterior. Sin embargo, al tratar de moverlo, notó la rigidez antinatural de las articulaciones, y lo confundió con que su novia estaba de mal humor por ello.</p>
<p>"¿Estás enojado conmigo? Sólo quería darte un pequeño masaje", preguntó.</p>
<p>Anaxágoras se molestó con la pregunta. "No es así. Es que hoy me siento tenso de los brazos".</p>
<p>Phainon sonrió, aunque su rostro parecía un poco cansado después de que Anaxágoras siguiera observando su semblante. No era de extrañar, sabiendo que el joven tenía el hábito de mantener una actitud amigable a pesar de las situaciones.</p>
<p>Pero entonces se quedó quieto. Un silencio incómodo y preocupante se prolongó mientras sus ojos parpadeaban y reflejaban una emoción tan extraña.</p>
<p>"Tenemos que llegar a Okhema lo antes posible."</p>
<p>Todo sucedió tan rápido. Incluso el ingenioso Anaxágoras lo admitió.</p>
<p>Un momento estaban en la biblioteca confiando el uno en el otro, y al siguiente corrían por los pasillos de la Arboleda.</p>
<p>Pasaron junto a cuerpos en descomposición, algunos reconocibles como sus amigos, otros vistiendo uniformes de eruditos como sus amigos. Todos estaban indiscriminadamente golpeados en el suelo, sin ningún rastro de vida. Pasaron a toda velocidad por delante de muebles rotos, saltaron sobre escombros de madera y yeso, pisaron papeles esparcidos aquí y allá.</p>
<p>"Phainon, ¿qué significa esto, por qué estás tan alarmado de repente?", trató de preguntar, pero el Libertador se apresuró a silenciarlo antes de que pudiera sacarle nada, diciendo: "No tenemos tiempo. Te lo contaré todo cuando lleguemos allí".</p>
<p>Todo era correr. Correr durante horas. Agitar espadas durante horas. Patear y golpear carne podrida durante horas.</p>
<p>Incluso alguien tan fornido y fuerte como Phainon empezó a sentirse exhausto, y mucho más el frágil novio Anaxágoras, que carecía de su propia y confiable arma, que por pura suerte había logrado matar monstruos el día anterior con un fuerte golpe usando el libro que había estado sosteniendo.</p>
<p>Los jadeos resonaron por los pasillos. Muchas veces la coordinación de Anaxágoras fue pobre y resultaron en su caída varias veces, pero siguió corriendo de todos modos. Corrió, hasta que no pudo más, y luego reunió la fuerza restante para agarrar y tirar de la mano de Phainon.</p>
<p>"Ya basta... Descansemos aquí. Esta es la casa de los Venerationists. Dijiste que estaríamos a salvo por el momento aquí."</p>
<p>Phainon detuvo su camino, volviéndose para mirar a su amante. Todo exhausto, con el pecho subiendo y bajando dramáticamente, el sudor corriendo por la frente y mojando el cabello largo y sedoso que caía por su espalda.</p>
<p>Por lástima, asintió y ayudó a Anaxágoras a sentarse encima de un altar utilizado por los Venerationists.</p>
<p>Al tomarse por fin un descanso, Anaxágoras suspiró y se masajeó las sienes, aunque con lentitud, pues sentía malestar en las manos y en las piernas.</p>
<p>"¿Qué es todo esto?", frunció el ceño. Su voz era notablemente más ronca que la de los dos últimos días, pero todavía había en ella el ingenio que caracteriza a Anaxágoras.</p>
<p>Phainon le dio la espalda a la otra persona, ya que no tenía corazón para mirarle a los ojos. Se tomó su tiempo, intentando componer su expresión, y luego respondió lentamente: "Se trata de ti, tenemos que llegar a Okhema para que no te deteriore más".</p>
<p>Al no escuchar nada de su profesor, continuó: "El ambiente te está afectando, Anaxa. Como este lugar está lleno de criaturas desconocidas, sus-"</p>
<p>"Esa no es toda la historia, ¿verdad?"</p>
<p>El hombre de pelo blanco se quedó perplejo. "¿Qué quieres decir?"</p>
<p>"Pasaste por alto que si ese fuera el caso tú también habrías sido afectado. Así que debió haber sido otra cosa, ¿qué es?"</p>
<p>Phainon guardó silencio durante varios minutos, que a Anaxágoras le parecieron una eternidad. Por supuesto, ¿se podía culpar al joven Libertador? Cuando su novia fue directo al grano, a pesar de que él había tratado de ocultarlo. No sabía cuánto sabía Anaxa. Después de todo, el erudito siempre estaba a un paso de los demás para descubrir la verdad.</p>
<p>Suspiró, esbozando una sonrisa triste: "Después de todo no puedo esconderte nada, profesor. Te... te contaré todo ahora".</p>
<p>"Anaxa, la verdad es que ya estás muerto. Tú... Falleciste hace un año, en el Trono Luminario".</p>
<p>La expresión de la novia era solemne. Tenía la mirada gacha.</p>
<p>"Lo sé."</p>
<p>"¿Lo sabías?"</p>
<p>"He leído los periódicos que mencionan mi muerte. Hyacinthia escribió un libro en mi memoria. El entumecimiento del tacto, la frialdad de la piel, la rigidez de mis extremidades en este momento, todos ellos eran signos de mi muerte".</p>
<p>"Sí... Te estás descomponiendo ahora mismo. Por eso tenemos que ir a Okhema. Tal vez Lady Tribbie pueda ayudarnos, o Lady Aglaea... Y entonces, puedas volver a vivir".</p>
<p>Un largo e insoportable silencio llenó la habitación. Phainon volvió a abrir la boca.</p>
<p>"Vine aquí para traerte de vuelta. Sabía que sería temporal, antes de que empezaras a pudrirte de nuevo, pero estaba preparado para llevarte a Okhema tan pronto como te despertaras. Simplemente no pensé que pasaría tan rápido..."</p>
<p>"Pero ¿por qué?", preguntó Anaxágoras, alzando la mirada para encontrarse con la de Phainon.</p>
<p>A cambio, Phainon miró hacia abajo y se alejó de él.</p>
<p>"Porque te amo. Quiero que vuelvas a tener una vida digna".</p>
<p>El ojo del erudito se abrió de par en par.</p>
<p>Phainon lo sabía, todo esto habría sido demasiado para cualquier otra persona. Sabía que si se enfrentaba a Aglaea con todo esto, muy bien podría ser su fin. Sabía que había una posibilidad horriblemente decente de que Anaxágoras pudiera incluso ser martirizado para apaciguar a los excesivamente religiosos.</p>
<p>Después de todo, ¿revivir a un mortal? Era algo parecido a una burla al Titán de la muerte.</p>
<p>Y lo que es más importante, sabía que Anaxágoras no se tomaría bien su muerte. Era algo que le daba miedo desde que su novia abrió los ojos en el estudio.</p>
<p>Una voz silenciosa reverberó en la habitación, "...Idiota."</p>
<p>Un insulto, pero no motivado por la ira. Phainon se dio cuenta de ello, porque esperaba que Anaxágoras estuviera enojado, disgustado, y por eso había imaginado miles de escenarios como este para prepararse. Sin embargo, nunca previó esta reacción. Un simple castigo.</p>
<p>"Ven aquí", dijo el profesor. Extendió sus manos hacia Phainon y, cuando el joven se acercó lentamente hacia él, le tomó la mejilla.</p>
<p>El agarre era tan tierno, pensó Phainon, que aunque la piel estaba fría al tacto, Phainon podía sentir fuego ardiendo dentro de él.</p>
<p>"¿No estás enojado conmigo?", preguntó con cautela.</p>
<p>Anaxágoras tarareó, su pulgar acariciando la piel regordeta. "¿Quieres que lo esté?"</p>
<p>Phainon no respondió. Sólo se arrodilló y hundió la cabeza en la delgada cintura de Anaxágoras, envolviéndola con sus brazos.</p>
<p>"Y pensar que llegaste tan lejos como para vestirnos y demás", se rió.</p>
<p>"¿Cómo lo hiciste? Ciertamente no estabas usando mis registros de parapsicología como referencia para revivirme".</p>

<p>¿Qué clase de estudiante es lo suficientemente descarado como para actuar así frente a un profesor al que la gente a menudo llama El Blasfemo? Por eso, hace que mucha gente se pregunte, ¿tiene algo que ver con Phainon como uno de los herederos de Chrysos?</p>

<p>Los demás Herederos lo negaron, ese chico es simplemente un caso especial.</p>

<p>Incluso Hyacine, la asistente de enseñanza de Anaxa, solo se ríe de eso cuando se acercan a ella y le preguntan sobre este asunto. El profesor Anaxa nunca menciona a este estudiante específico suyo en privado, pero Hyacine solo sabe que el profesor nunca ha sido alguien que rechazaría a las personas que vienen a hacerle preguntas o debatir con él sobre un tema.</p>

<p>"¿Qué pasa, Phainon?" Phainon se para frente a su escritorio, por lo que Anaxa se detuvo en medio de la redacción de la discusión de hoy.</p>

<p>"Creo que esa marca finalmente ha vuelto a su estado normal".</p>

<p>Ha pasado un tiempo desde la última vez que Phainon sacó el tema de la marca de almas gemelas y su teoría. Hace unos meses le dijo a Anaxa con mucho entusiasmo: "¡vuelve a pasar algo único!", exclamó mientras le mostraba a Anaxa su marca una vez más.</p>

<p>Hace semanas, Phainon se volvió a arremangar y vio que la marca del reloj de arena estaba ahora acompañada de un eclipse. Anaxa sintió inmediatamente curiosidad al ver esta anomalía; algo debía estar sucediendo. Aún mantenía su experimento en secreto, pero con la participación de su variable dependiente (en este caso, es Phainon), compartir abiertamente esta clase de información con él es de gran ayuda.</p>

<p>Anaxa recordó que sugirió escribir y mantener una nota de observación, con el fin de fechar y registrar si había algún otro cambio a lo largo del camino.</p>

<p>"¿Hiciste una nota de observación?" Phainon asintió y le mostró su nota que trajo consigo.</p>

<p>"En ese período, ¿pasó algo más?"</p>

<p>Phainon abre su cuaderno, pasando las páginas, "eso es el problema, profesor. Los cambios están tomando bastante tiempo". Señaló una entrada, fechada hace dos o tres semanas, "antes, los cambios siempre habían sido casi inmediatos, tomaban menos de un día, pero este eclipse tomó más tiempo".</p>

<p>Anaxa estudia las notas de Phainon meticulosamente. Intentó registrar una línea de tiempo para hacer coincidir la fecha escrita allí con su propio proceso de curación de heridas.</p>

<p>En la primera entrada, Anaxa se da cuenta de que puede sentir algunas muescas en las líneas donde estaba en blanco, parece como si alguien hubiera presionado su bolígrafo con demasiada fuerza mientras pensaba en algo. Con los ojos todavía fijos en las notas, llamó: "Phainon, ¿encontraste una nueva hipótesis?"</p>

<p>El hombre en cuestión se frota el cuello, "bueno, más que una hipótesis, esto podría ser sólo una corazonada. No tengo nada que lo respalde, sólo mis instintos que me dicen algo."</p>

<p>Anaxa se apoyó la barbilla en la mano, sus ojos brillando por la anticipación de la respuesta de Phainon, "... ¿y? ¿Te importaría compartirla conmigo?"</p>

<p>Phainon se mordió el labio inferior, como si supiera que eventualmente lo atraparían con las manos en la masa. Tal vez por eso, en lugar de estar simplemente inseguro, sonaba como si estuviera confesando un pecado. Mantuvo su voz estable, reprimiendo la emoción que sintió cuando escribió esa entrada. "Sentí que algo le estaba sucediendo a la otra persona que lleva la marca conectada con la mía. Y, para ser honesto, se siente insoportable".</p>

<p>"Como se afirma en la Teoría del Alma: Conexión entre cada individuo. En el capítulo tres se dice que esta conexión no es meramente una manifestación de romance, sino una relación mucho más compleja. Esto se debe a que la relación involucra no solo afecto sino también profunda empatía entre individuos que comparten esta conexión."</p>

<p>El par de ojos azules observa de cerca la reacción de su profesor. Con la esperanza de que su corazonada no sea rotundamente negada y calificada de pseudoreacción vinculándola a la teoría que acaba de citar.</p>

<p>"Pero no tienes ninguna prueba", responde Anaxa, y comprende por qué Phainon no se atrevió a llamarla hipótesis, ya que todo sigue siendo vago y no hay nada claro sobre cuál podría ser la causa de dicho fenómeno. "¿Tienes algo que hacer después de esto?"</p>

<p>El más joven niega con la cabeza mientras Anaxa recoge sus cosas, "ve a buscar tu bolso y sígueme". Phainon parpadea en respuesta, temiendo haber escuchado mal la instrucción.</p>

<p>"A menos que ya no te interese esto." Esa es la línea que devolvió a Phainon a la realidad, él rápidamente hace lo que dijo su profesor y se dirige detrás de él.</p>

<p>Los dos caminaban por los largos pasillos de la academia. Todavía había muchas clases y seminarios ese día, así que no era de extrañar que el lugar estuviera abarrotado de gente. Pero poco a poco, la escena fue cambiando y cada vez encontraban a menos gente en su camino. Phainon empezó a preguntarse hasta dónde llegarían. Habían atravesado el edificio principal y poco a poco se acercaban al ala este, que los estudiantes rara vez visitan a menos que tengan propósitos específicos.</p>

<p>El profesor Anaxa se detuvo en uno de los rincones tranquilos de la Arboleda. Abre un sello que oculta su laboratorio. Algo que a Anaxa nunca se le había pasado por la cabeza antes, sabiendo que su espacio personal contiene muchas cosas que no deberían ser de consumo público, especialmente a sus alumnos que resultan ser herederos de Chrysos también.</p>

<p>"Mi laboratorio", confirmó Anaxa antes de que Phainon le preguntara. Phainon, que estaba desconcertado, finalmente se mueve y continúa caminando detrás de Anaxa. Sus ojos brillan mientras echa un vistazo hacia pilas de libros, varios diagramas de matrices y filas de tubos de ensayo y otras piezas de cristalería cuidadosamente dispuestas en un armario al otro lado de la habitación.</p>

<p>No era su primera vez en un laboratorio. Una de las materias en las que se inscribió en este semestre fue Introducción a la Alquimia, pero este es el laboratorio del profesor Anaxágoras, ese profesor con lengua afilada y que a menudo daba tareas brutales a sus estudiantes a lo largo del año.</p>

<p>"Toma", Anaxa saca unos cuantos libros de su escritorio y añade unos cuantos pergaminos más encima. "Estos podrían ayudarte."</p>

<p>Phainon leyó por encima el título del libro que le habían entregado. Querido Kephale, su profesor le acababa de dar acceso a más materiales a los que no podía echarle el guante en la Biblioteca de Philia. Asombrado, soltó: "Pensé que no le interesaba este tema, profesor".</p>

<p>Anaxa se apoya en el borde del escritorio con los brazos cruzados. "Mi escepticismo solo se vería demostrado si no hubiera teorías que subyacen a esta marca y al fenómeno de las almas gemelas". Dijo con una ligera irritación en la lengua: "Las he leído todas y pensé que tal vez las encontrarías útiles".</p>

<p>Escaneó el título uno por uno; Perspectiva Psicológica: El Subconsciente y su Impacto en las Relaciones Humanas, Los Límites de la Psicología y la Titanología, y Realidad y Mitos Detrás del Romanticismo del Alma Gemela.</p>

<p>"Este tema tiene el potencial de estar en mi campo de estudio, pero por ahora todavía no he tenido la oportunidad de investigar más en él".</p>

<p>A Phainon no le toma mucho tiempo darse cuenta a dónde se dirige esta conversación. Su labio se contrae por la agitación antes de que él mismo no pueda evitar sonreír tan ampliamente mientras hace su declaración. "Haré lo mejor que pueda para no ser una decepción para usted, profesor Anaxa".</p>

<p>Anaxa se contuvo cuando casi se deja influenciar por su contagiosa sonrisa. "Anaxágoras." Él corrigió a Phainon una vez más, pero esta vez Phainon no se avergonzó sino que se rió al escucharlo.</p>

<p>Que Phainon haya decidido el tema de su tesis cuando era estudiante de primer año y que se haya comprometido a ella todavía no significa que su camino hacia la graduación esté lleno de flores, de hecho, es todo lo contrario. Incluso ahora sigue asistiendo al seminario del profesor Anaxágoras como excusa para conseguir más tiempo para reunirse con él aparte de su sesión de consulta habitual.</p>

<p>Este momento es el ejemplo perfecto. Phainon lo sigue a su oficina después del seminario.</p>

<p>"Incluso Cas había progresado más que yo".</p>

<p>Castorice es una estudiante del mismo año y parecía ser cercana a él. Anaxa la recuerda muy bien porque le dejó una profunda impresión.</p>

<p>Pero al oír a su estudiante quejarse y no aportar nuevas preguntas ni nada nuevo a la mesa, Anaxa sólo lo miró de reojo ya que todavía necesita concentrarse en los exámenes que debía calificar.</p>

<p>"Phainon, si quieres desahogarte te sugiero que vayas a la clínica y no a mi oficina." Broméa Anaxa, a lo que Phainon responde haciendo contacto visual directo con él. Después de un rato, ya no se pone nervioso y este comportamiento está haciendo poco a poco que a Anaxa le duela la cabeza.</p>

<p>Puso su mano sobre la mesa, una sonrisa se deslizó por su rostro como cuando mantenía su expresión habitual. "Pero si estoy aquí, siento que podría hacer algún progreso".</p>

<p>Anaxa le lanzó una mirada mientras Phainon seguía inmutable y comenzó a sacar varios libros, un pergamino en blanco y un bolígrafo. "Creo que debo recordártelo otra vez, mi oficina no es una sala de estudio de la biblioteca."</p>

<p>Su movimiento se detuvo pero no volvió a guardar todas sus pertenencias. Por el contrario saca su pequeño memo e ignora por completo la mirada gélida de Anaxa.</p>

<p>"Solo esta vez, profesor. Por favor..." le ruega, lo que hace que Anaxa se enoje, porque esta es la enésima vez que enmascara algo bajo el disfraz de "solo esta vez".</p>

<p>"También tengo algunas preguntas y..." hay un tramo de silencio antes de que él continúe, "finalmente encontré a mi informante". Exclama felizmente, tratando de ocultar lo que quería decir antes.</p>

<p>En el pasado, Anaxa le sugirió a Phainon que no se esforzara tanto, si no hay nadie que esté dispuesto a ser su informante, que así sea. Podía realizar su experimento para su tesis usando material disponible para ellos en este momento.</p>

<p>Su terquedad dio sus frutos, piensa Anaxa al escuchar el detalle sobre el informante de Phainon. Su credibilidad, sus antecedentes y toda la información necesaria, antes de pasar a la lista de preguntas para Phainon cuando necesita hacer la entrevista con ellos.</p>

<p>Este es el punto de inflexión de Phainon después de haber estado atrapado por mucho tiempo.</p>

<p>"¿Crees que tu punto de vista cambiará después de que termines tu tesis?" le preguntó Anaxa, ya que el que realizó la investigación también era parte de este fenómeno de almas gemelas.</p>

<p>Phainon inclinó la cabeza y su mano había dejado de escribir. "Tal vez", respondió, "creo que los humanos tienen libertad de elegir en la vida. Al igual que este vínculo forjado no siempre significa que deba ser la base del romance".</p>

<p>"Buena respuesta", Anaxa dejó el trabajo que había terminado de calificar, "el alma es mucho más compleja que eso, reducirla a una sola cosa sería un ejemplo de absurdo".</p>

<p>"Profesor, no creyó que yo creyera ciegamente en esto, ¿verdad...?"</p>

<p>"No, pero parece del tipo romántico empedernido."</p>

<p>Phainon se ríe por la conversación que tenían, simplemente tomó una dirección que no había previsto. "Tal vez el profesor no se equivoque del todo en eso. Pero, incluso si creo en cosas como el amor verdadero, eso no significa que tenga que depender de esto, ¿verdad?", insinuó por la marca debajo de su manga.</p>

<p>"Supongo que ya sabías la respuesta."</p>

<p>Su discusión se calmó después de la respuesta de Anaxa, y se disolvió en que los dos hicieran lo suyo. No duró mucho porque Phainon decidió romper el silencio una vez más.</p>

<p>"Profesor". Lo llamó, olvidando que cada disparate que dice ha provocado que su profesor lo mirara de reojo, pero aun así seguía tentando a su suerte. "Tengo una... petición para usted".</p>

<p>Anaxa está a punto de frotarse las sienes, lo último con lo que quería lidiar hoy es entretener a las locas ideas de Phainon. Pero, ¿ahora parece que se atreve a pedirle algo?</p>

<p>"Primero, ¿qué te hace pensar que pedirme algo sería una buena idea?" Anaxa intenta ignorar la audacia de su alumno sumergiéndose en el ensayo que tenía en la mano. "Segundo, ¿alguna vez se te pasó por la cabeza que esto podría ser una violación en términos de ética académica?"</p>

<p>Phainon dejó escapar unas suaves risas que podían escucharse claramente en medio de la falta de sonido a su alrededor. Debería estar claro que su sugerencia es claramente absurda y que estaba cruzando la línea, pero parece decidido a no dar marcha atrás incluso después de eso.</p>

<p>"Profesor Anaxa," está usando un tono mucho más suave, Anaxa mirándolo fijamente. Si la mirada del profesor pudiera dañar físicamente a las personas, entonces tal vez Phainon necesite visitar el Patio Crepuscular justo después de esto. "¿Sería capaz de hacer una excepción si se trata de una solicitud personal?"</p>

<p>"Le estoy preguntando a Anaxágoras, no al profesor Anaxágoras." Fue una de las raras ocasiones en que Phainon lo llamó por su nombre completo. Lo dijo mientras esbozaba una sutil sonrisa. "Una petición de Phainon de Aedes Elysiae. Sólo Phainon, no el estudiante de la Arboleda de la Epifanía ni el tuyo."</p>

<p>"Ese no es el problema, Phainon." El más joven todavía no ha roto el contacto visual con él, "incluso si lo dijiste de esa manera. Igual no cumpliría con tu pedido personal."</p>

<p>Phainon espera que Anaxa continúe. Se mantiene calmado y compuesto, como lo hace habitualmente cuando debate. Es calmado, pero Anaxa lo conocía bien. Es como un lago fascinante que ahogará a los demás sin dar más señales y solo dejará pequeñas ondas atrás.</p>

<p>"Nunca he tenido favoritismos entre mis estudiantes y tú no eres una excepción." Anaxa suspiró, "hasta aquí llegan las relaciones entre un profesor y sus estudiantes. No tengo ninguna obligación de cumplir con tus absurdos."</p>

<p>La sonrisa en el rostro de Phainon no se había desvanecido, incluso cuando el resplandor de sus ojos pareció disminuir. Finalmente rompió el contacto visual al mirar hacia abajo y con una voz similar a un murmullo Phainon preguntó, ". ¿es eso así?"</p>

<p>Anaxa no tuvo la oportunidad de reprocharle cuando Phainon repentinamente le tiró de la mano, lo hizo perder el equilibrio y cayó en los brazos de Phainon. En una fracción de segundo las manos de Phainon alcanzaron su rostro y luego sus labios se encontraron.</p>

<p>Él es mucho más fuerte que Anaxa, así que cuando Anaxa intentó empujarlo lejos fue inútil y Phainon luchó contra él profundizando el beso. Era cualquier cosa menos romántico; era sucio y desesperado, una muestra de pura emoción. Phainon mordió el labio de Anaxa y dejó entrar su lengua, reacio a dejar ir a Anaxa.</p>

<p>Él frota las mejillas de Anaxa con su pulgar cuando finalmente se aparta. Su profesor está recuperando el aliento. Phainon limpia rastros de saliva que manchan el hermoso rostro de Anaxa y en ese momento exacto Phainon es empujado lejos.</p>

<p>"Sal de mi oficina." Es un ultimátum, Anaxa ni siquiera necesitó preguntar por qué estaba haciendo todo eso, no necesita ser más complicado que esto. Debería haberlo sabido, debería haberlo predicho y visto lo suficiente en los últimos cinco años que lo vigiló, Phainon es el cisne negro. Ahora lo había hecho, el acto que no se puede revertir y enmendar. El impacto perdurará.</p>

<p>La expresión de Phainon es ilegible, da un paso atrás antes de recoger sus cosas y desaparece tras una puerta cerrada. No se dijeron despedidas, el silencio dejado dentro de la habitación ahora se sentía ensordecedor.</p>

<p>Primer Experimento: Marca del Alma y el Impacto del Factor Externo en Ellas</p>

<p>Arboleda de la Epifanía, Nousporist</p>

<p>Estudio de las Almas, Mes de la Libertad</p>

<p>Instructor del laboratorio: Anaxágoras</p>

<p>Resumen</p>

<p>La teoría respecto al alma gemela aún no ha podido ser comprobada científicamente por falta de evidencia que la sustente. Por tanto, identificar y comprender mejor las marcas del alma gemela podría resultar beneficioso para el avance de nuevas investigaciones en este campo. Las marcas del alma no sólo son diferentes para cada pareja sino también para los individuos implicados. Las marcas representan una parte de la esencia del alma de su pareja gemela. Además de las diferencias en apariencia, la ubicación de la marca será diferente para cada individuo. La hipótesis nula en este experimento es que la reacción que se desencadena cuando las almas gemelas se encuentran tiene el potencial de variar también para cada individuo. Así como la reacción cuando la marca del alma es influenciada por cierto factor externo.</p>

<p>Introducción</p>

<p>Las marcas del alma gemela son un territorio que no ha sido ampliamente explorado en los estudios del alma. Estas marcas aparecen de manera irregular e impredecible en determinados individuos, y la marca solo puede ser reconocida por el individuo conectado a ellos.</p>

<p>No sólo estas marcas se consideran raras, sino que cada una de las marcas del alma tiene su propia singularidad, ya sea en la ubicación en el cuerpo de alguien o en la forma que adopta. Este experimento tiene como objetivo conocer la reacción de cada marca cuando se encuentra con su respectivo par. Según el resultado, también existe la posibilidad de cortar la conexión con el alma.</p>

<p>Materiales y Método</p>

<p>Este experimento fue llevado a cabo en el Laboratorio Anaxágoras, Arboleda de la Epifanía, en el 5to día del Mes de la Libertad. La marca utilizada en este es la marca del sol azul en el pecho de Anaxágoras. La prueba es para probar el impacto del factor externo en la marca del alma y su reacción cuando la marca del alma conectada se encuentra. El primer experimento incluye distorsión de la forma de la marca utilizando bisturí. Los datos sobre el sujeto de este experimento se adjuntan a continuación.</p>

<p>Resultados</p>

<p>La distorsión en la marca del alma provoca una reacción diferente en función de la reacción inicial de la marca cuando se encontró con su par. El sujeto Anaxágoras, que experimentó una reacción mental antes del experimento, ahora tiene una reacción más atenuada cuando la marca aún se está curando y recuperando su forma inicial. Por otro lado, en función de la observación de la marca que cambió visualmente, mostró una forma diferente cuando su par se distorsionó y se recuperó que en su reacción habitual.</p>

<p>El periodo de curación también afecta la longitud de los cambios en las marcas alteradas visualmente. A partir de este experimento se puede concluir que los factores externos ejercieron influencia para los cambios que ocurren mental o visualmente en cada individuo cuya alma está entrelazada.</p>

<p>El informe del primer experimento de Anaxa de hace varios años ahora empezó a perder brillo. Phainon se graduó ayer de la Arboleda. Actuando como su yo habitual, como si no hubiera ningún incidente entre ellos sucediendo meses atrás.</p>

<p>Debería haberlo visto venir, ese hombre es la encarnación del caos, trajo a la mesa una apuesta con alto riesgo. Con su ingenio y cerebro, Phainon sabía lo que había hecho. Está asumiendo el riesgo porque está seguro de que Anaxa está mintiendo; ambos lo están haciendo, se engañaron mutuamente todos estos años.</p>

<p>Phainon no tiene nada que pruebe su hipótesis, por lo que se lanzó de lleno a este experimento, sin teorías de apoyo, notas de observación ni nada, solo sus instintos y todo lo que sentía y veía cada vez que estaba con Anaxa.</p>

<p>Anaxa debería haber sabido que esto sucedería algún día.</p>

<p>¿Acaso está demasiado ocupado con sus propios pensamientos e investigaciones, lo que ha provocado este error de cálculo al usar la espada de doble filo que lanzó hace años? ¿O hay alguna otra causa fuera de su ecuación que aparece repentinamente como un elemento desconocido?</p>

<p>Respiró profundamente una vez más.</p>

<p>No se necesita ser un genio para darse cuenta de qué tipo de error cometió en dicho cálculo. Anaxa llega un poco tarde, su afirmación de no tener favoritismos entre sus estudiantes era errónea. Juega a ser su favorito, especialmente cuando sus sentimientos están involucrados en esas ecuaciones caóticas.</p>

<p>Después de admitir que sus sentimientos son reales, no quiere hacer nada al respecto. Tienen sus propios caminos que habían elegido recorrer, Anaxa sabía que Phainon se unirá a los demás herederos de Chrysos en el Viaje Rastreallamas para cumplir la profecía y el destino que llevan.</p>

<p>Rozó levemente con su mano la parte de él que ahora está vacía. Su relación debería terminar aquí, tal como su marca no solo está distorsionada sino que se ha borrado por completo.</p>

<p>Ahora son sólo dos personas normales. Ya no hay almas y destinos entrelazados, ya no son almas gemelas.</p>

<p>El vasto cielo azul y brillante de Okhema es algo que no veía desde hacía mucho tiempo. Después de apenas haber escapado de la Arboleda luego de que la marea negra la consumiera, sin mencionar la aparición del espadachín enmascarado que ataca a la núcleo-llama de Cerces, por supuesto que lo último que se le cruzará por la cabeza es ver el brillante sol brillar sobre ellos.</p>

<p>Bajo el eterno sol del Dispositivo del Alba de Kephale, Anaxa sabía que la probabilidad de que finalmente se reunieran era alta, pero no esperaba que fuera tan pronto.</p>

<p>"¿Quién eres?"</p>

<p>Incluso si trató de hacerlo sutil, después de escuchar eso la expresión de Phainon cambió. Pero Anaxa mantiene su farsa y se mantiene firme en su postura.</p>

<p>El joven guerrero parecía haber imitado la manera en que su profesor solía responder a sus tonterías en el pasado. Con un tono tan frío como el hielo, respondió con otra pregunta. "¿Tan olvidable soy para usted?"</p>

<p>Los demás ya se estaban reagrupando antes de que él pudiera responder. Acordaron descansar, después de todo ha sido un día largo.</p>

<p>"Profesor Anaxa, usted también debería ir a descansar." Phainon lo hizo tan bien para convencer a los demás, que parece que está preocupado por él. Es como si una persona de hace unos minutos, a quien hablaba con tanta crueldad, no fuera él.</p>

<p>Antes de que tomen caminos separados, Phainon atrapa la muñeca de Anaxa. "Puedes ir tú primero, Mydei". Le dijo al único Heredero de Chrysos que aún no se había ido. "Yo acompañaré al profesor primero a su alojamiento".</p>

<p>Mydei levantó las cejas, "está bien, Libertador. Me iré entonces". El hombre de Kremno no quiere entrometerse en sus asuntos y dejó a los dos solos en silencio.</p>

<p>Phainon saluda a Mydei pero no dice ni una palabra ni a él ni a Anaxa. Después de ver a Mydei abandonar las instalaciones, arrastra a Anaxa con él para que se igualen a sus pasos. Nadie se inmutó al ver esto, ya que Phainon sonrió a todas las personas con las que se encontraron en el camino. La sonrisa no le llegó a los ojos y Anaxa pudo notarlo.</p>

<p>"Dime qué pretendes lograr con esto." Anaxa lo exigió, pero aún no se esforzó por liberarse del agarre de Phainon. Entrecerró su mirada, pero Phainon desvió los ojos y cerró la puerta de la habitación detrás de él.</p>

<p>"Phainon."</p>

<p>"Si no quieres hablar como una persona normal entonces suéltame." Le explicó, cansado por cómo actúa Phainon. Sin una comunicación adecuada no habrían llegado a ninguna parte, Phainon debería haber sabido sobre esto-es muy bueno con las palabras después de todo. Pero, eso sólo si quiere reconocer algo en este lío.</p>

<p>Phainon empujó a Anaxa, este soltó un pequeño quejido cuando su espalda chocó contra la dura pared. Las diferencias de altura son demasiado evidentes ahora cuando Phainon lo atrapó en esa posición.</p>

<p>"... Anaxa." lo llamó, como una persona que finalmente encuentra su voz que había estado perdida hace mucho. "Anaxa."</p>

<p>Siguió repitiendo el nombre de Anaxa una y otra vez. Lo despojó de su título, mucho menos de su nombre completo. Como un disco rayado, su boca repitió el mismo nombre como si fuera parte de un hechizo ritual.</p>

<p>Murmullos incoherentes se derramaron por todas partes.</p>

<p>Al contrario de su acto anterior, Phainon se acerca, acariciando la mejilla de Anaxa con una mano. Tratando al otro hombre como si fuera una frágil artesanía de vidrio, algo que se desmoronará al tocarlo.</p>

<p>Anaxa no se atreve a alejarlo como hace años, pues podía sentir el leve temblor proveniente de la misma mano.</p>

<p>Anaxa podía sentir el aliento cálido de Phainon en su piel mientras él elimina lentamente la distancia entre ellos. Haciendo eco de su caótico primer beso, no es que este sea diferente de ninguna manera.</p>

<p>Phainon parecía haber perdido el control sobre la máscara de héroe perfecto que usa y haberse convertido en otra persona.</p>

<p>El que estaba frente a Anaxa era un humano común y corriente, solo un hombre, que reclamó desesperadamente los labios de Anaxa.</p>

<p>Se sorprende por una fracción de segundo, pero luego recupera la compostura. Anaxa no mostró ninguna señal de resistencia cuando extendió sus manos para abrazar a Phainon, quien reaccionó inmediatamente. Phainon se sorprendió al ser recibido por tal calidez en lugar de un rechazo.</p>

<p>En el momento en que finalmente se separan, Anaxa abre el ojo y se encuentra con unos iris de color azul cerúleo nublados. Esta calma es más bien engañosa, como la calma antes de la tormenta, antes de que alguien se estrelle.</p>

<p>Phainon levanta a Anaxa como si no pesara nada y lo acuesta cuidadosamente encima del diván.</p>

<p>"Anaxa", volvió a gritar. El malestar enturbiaba sus palabras, mostrando que no eran solo sus manos las que temblaban. Anaxa está más que feliz de recibirlo con los brazos abiertos.</p>

<p>La comunicación verbal ya no era la única opción que quedaba, para Anaxa es más que suficiente. Él puede comunicárselo y sofocar la tormenta que ruge en el corazón de este hombre. Lo hará, incluso si no está preparado para lo que vendrá después.</p>

<p>Phainon lo desnudó. No dejó ni un solo trozo de tela que le cubriera el cuerpo. Besó el dorso de la mano de su antiguo profesor, dándole poco a poco pequeños besos, subiendo hasta su clavícula.</p>

<p>Sin nada de ropa, Anaxa se ve tan pequeño, tan frágil. Se detiene por un segundo cuando ve el horror en la forma de un vacío en medio de su pecho. Debería haber asustado a otras personas, pero no a Phainon. Lo mira con amargura mientras su dedo traza sus bordes.</p>

<p>"No te he visto en años y ahora apareciste después de regresar de la puerta de la muerte." Anaxa no respondió a las palabras de Phainon, "¿Acaso encontrar la verdad es más importante que la vida misma para ti?"</p>

<p>Bajo la mirada inquisidora de Phainon, su respuesta pareció llegar minutos tarde. Anaxa quería hablar de esto con cuidado, pero lo que dijo era en cierto modo cierto: nunca había sido alguien que se fijara demasiado en la vida; la piedra filosofal y sus almas destrozadas son su prueba.</p>

<p>"Fue un sacrificio necesario." Sostiene, "al igual que tu Viaje, llegará el momento en el que será necesario un sacrificio, ya que es el único camino a seguir."</p>

<p>Anaxa gira el rostro hacia otro lado antes de continuar. "La núcleo-llama de Cerces es prueba definitiva de ello".</p>

<p>Phainon da un golpe con la mano derecha, y aterriza a pocos centímetros del rostro de Anaxa. "¿Sabías que sentía algo por ti?" Se sintió abrupto, ya que sonaba más como el lamento de una bestia salvaje en lugar de una pregunta. Su expresión nublada ahora resplandecía con una rabia hirviente.</p>

<p>"Puedes tener sentimientos -amor por cualquiera-, a pesar de la marca que llevas. ¿No es esa la conclusión de tu tesis?" Anaxa frota la muñeca de Phainon, "Si yo o alguien lo supo, no tiene nada que ver con ello".</p>

<p>Al escuchar eso, Phainon agarró inconscientemente el hombro de Anaxa. Anaxa hizo una mueca y volvió a mirar al hombre a su lado. Una vez más, el azul cerúleo se encontró con su ojo magenta. "Sé que en realidad no me amabas." Siseó Anaxa, "¿no estabas intentando probar algo, tanto ahora como todos esos años atrás?"</p>

<p>"Todavía estás obsesionado con esa marca, intentaste buscar si yo también tenía una."</p>

<p>"¿Crees que no me daría cuenta?"</p>

<p>"No..." Phainon lo negó, y solo aflojó su agarre cuando se colocó para mostrar su dominio sobre Anaxa poniéndose encima de él. Su mirada es penetrante, especialmente cuando apretó los dientes al acusar a Anaxa. "... así que sabías de mis sentimientos todo el tiempo."</p>

<p>Anaxa no se acobardó. "Entonces, ¿cuál es tu propósito al hacer todo esto? ¿Tienes que despojarme de todo? ¿De mi dignidad? ¿Sólo para satisfacer tus propios deseos?"</p>

<p>"¡Eso no fue lo que quise decir!"</p>

<p>Estalló, y su ira se transformó en algo completamente nuevo. Esos brillantes ojos azules ahora se volvieron vidriosos, y gradualmente sus lágrimas fluyeron hacia el silencio que llenaba su espacio. Anaxa intentó ahuecar su rostro, pero Phainon lo rechazó.</p>

<p>"Tu atención fue cruel para mí", se ríe Phainon amargamente mientras lentamente baja la mano de Anaxa. Su respiración se cortó, contenido por un bulto de emoción que trató de suprimir. "Sé que le gusta polemizar, profesor Anaxa. Pero, ¿puede escuchar mi explicación por un ratito?"</p>

<p>La forma en que lo llamó, con título y no con apodo, ahora parecía demasiado formal y rígida. Sin embargo, Anaxa asintió en silencio para complacerlo.</p>

<p>"¿Sabías que hay una cosa que no mencioné en mi tesis?" Anaxa podía sentir el toque vacilante de Phainon alrededor del borde del vacío en su pecho. "Incluso si la forma física de la marca del alma se borraba, la conexión de su alma nunca se cortó".</p>

<p>"No podía romperse."</p>

<p>Su explicación perturbó a Anaxa, había pensado que ya se había liberado del hilo invisible que el destino tejía para ellos.</p>

<p>"No sé con seguridad qué estabas haciendo en ese momento, pero conociéndote, este podría ser el resultado de la alquimia, que causó que existiera este vacío."</p>

<p>"Pensé que no te importaba la marca del alma. Lo que sonó como algo que harías".</p>

<p>Sus lágrimas se habían detenido pero su voz flaqueó mientras continuaba. "Entonces, cuando me enteré de que Cas, Stelle y Dan Heng se dirigían a la Arboleda sentí algo", respiró profundo para evitar desmoronarse aún más, "Sentí tu alma disiparse lentamente. Como la arena deslizándose entre mis dedos, estoy indefenso y no puedo evitar que caiga".</p>

<p>"Después de eso, viniste a Okhema. Con un cuerpo aferrado a su última chispa de vida." Su contacto, aunque vacilante, se está volviendo tierno. Debí haberte tratado mejor que esto. Me disculpo profundamente por mi inmadurez, profesor Anaxa. Este acto mío no puede justificarse de ninguna manera.</p>

<p>"Solo quiero ver con mis propios ojos si estás bien."</p>

<p>Parecía que la pregunta que le hizo Anaxa cuando por fin se reunieron lo había asustado más de lo debido. "Olvidé que tal vez toda esa decisión era por mi imprudencia de aquel entonces. Olvidarme de todo y empezar un nuevo capítulo en tu vida".</p>

<p>"Lo siento."</p>

<p>Al oír aquello, Anaxa volvió a intentar hacer lo que había querido al principio: ahuecó el rostro de Phainon, que aún seguía húmedo por sus lágrimas. "No puedo aceptar una disculpa unilateral."</p>

<p>"Eres tan cruel." Comentó. Con los ojos cerrados, deleitándose con el fugaz momento de la calidez de Anaxa.</p>

<p>No duró mucho, ya que la realidad fue filtrándose poco a poco y debería parar y alejarse.</p>

<p>Finalmente sonrió, aunque fuera de forma leve. Phainon apartó de él aquel par de manos más pequeñas, y había empujado a Anaxa demasiado lejos de lo que debían ser sus límites. Se levantó: "Debería irme para que..."</p>

<p>Anaxa tiró de él con todas las fuerzas que le quedaban en su interior. Phainon perdió el equilibrio y casi aplasta a Anaxa de no ser por sus buenos reflejos. "¡Profesor!"</p>

<p>El hombre en cuestión parece inmutable y sólo empieza a acariciar el cabello de Phainon. Su dedo peinando los mechones blancos, bañado en la luz que se filtraba a través de las cortinas. "Respóndeme, Phainon," le susurró al oído.</p>

<p>"¿Por qué me amas ahora y entonces?"</p>

<p>Una expresión de asombro apareció en su rostro, intentó responder pero se le trabó la lengua y no pudo darle una respuesta.</p>

<p>"¿Hm?"</p>

<p>Cuando están tan cerca, Anaxa no pudo evitar notar cómo las puntas de las orejas de Phainon se vuelven rojas cuando finalmente pudo darle una respuesta satisfactoria.</p>

<p>"Alguien me convenció en el pasado de que, aparte del hecho de que llevo una marca de alma y estoy atado a un destino determinado, todavía tengo mi libertad de elegir y enamorarme de alguien." Su mirada refleja la compasión que sentía: "alma gemela o no, creo que este sentimiento es mío y sólo mío. No es el destino, el universo o los titanes los que me predijeron estar aquí y ser de esta manera".</p>

<p>"Te amo, Anaxágoras. Desde el fondo de mi corazón."</p>

<p>"Buena respuesta, realmente eres mi alumno más brillante." Anaxa no pudo evitar sonreír.</p>

<p>"¿Qué haces—?"</p>

<p>Anaxa puso su mano alrededor del cuello de Phainon, y allí sus labios se encontraron de nuevo. No era su primer beso, pero este no estaba lleno de desesperación, fue breve pero enfermizamente dulce.</p>

<p>Su mano se quedó incluso después del beso. Phainon parpadeó con incredulidad, hizo todo lo posible para procesar lo que acababa de suceder entre ellos. Con su carga invisible desaparecida, Anaxa se ríe suavemente y usa la confusión de Phainon como su palanca para robarle un pequeño beso, aterrizando en la esquina de los labios de Phainon.</p>

<p>"Prof-" Anaxa colocó su dedo índice en dichos labios.</p>

<p>"Me llamaste por mi nombre, ¿usas eso o quieres seguir siendo mi alumno como antes?"</p>

<p>"Anaxa..." como si estuviera atravesando un sueño que era demasiado hermoso para ser verdad, su voz estaba melancólica. "Anaxa." Volvió a llamar, asegurándose si esta es la realidad en la que vive.</p>

<p>"¿Sí?"</p>

<p>Para alguien que se atrevió a subirse encima de Anaxa, tropezó cuando le pidió algo, no sólo con la punta de las orejas, sino con el rostro que ahora se volvió más rojo con el pasar del tiempo. "¿Puedo... besarte de nuevo?"</p>

<p>Anaxa asintió, "por supuesto que puedes, Phainon."</p>

<p>Se acuestan uno al lado del otro, compartiendo el espacio encima del diván. El cuerpo de Anaxa está cubierto por la capa de Phainon. El dueño seguía reacio a dormir, con una mano jugando con el largo cabello de Anaxa que había dejado suelto. Inconscientemente tarareando una canción de cuna que recordaba de su pasado.</p>

<p>"Phainon", Anaxa, aunque se siente somnoliento, sigue despierto incluso si su ojo permanece cerrado. "Recuerdas que estamos en Okhema, ¿verdad?"</p>

<p>El joven inclinó la cabeza, ¿por qué Anaxa preguntaba algo tan obvio?</p>

<p>"Olvidé mencionar esto antes, pero debes tener en cuenta que Okhema está cubierto por los hilos dorados de Aglaea."</p>

<p>¿Oh...?</p>

<p>El rostro de Phainon se puso pálido, pero Anaxa aún no había terminado.</p>

<p>"También está Cerces, que vivió en mi cabeza desde que fusionaron su núcleo-llama con mi alma."</p>

<p>Phainon gimió ruidosamente, aparentemente sin escuchar más la explicación de Anaxa.</p>

<p>"Querido Kephale".</p>`

const $=id=>document.getElementById(id);
const POS=["10% 40%","90% 40%","50% 40%"];
let fav=new Set();try{fav=new Set(JSON.parse(localStorage.getItem("pw_fav")||"[]"))}catch(e){}
const guardar=()=>{try{localStorage.setItem("pw_fav",JSON.stringify([...fav]))}catch(e){}};
let tag="Todas",q="",cur=0,modo="home",visibles=[];
const imgTag=i=>`<img src="${IMG}" style="object-position:${POS[i%3]}" alt="">`;
const tapa=(h,i)=>`<div class="tapa">${imgTag(i)}<div class="vel"><h3>${h.titulo}</h3><small>${h.autor||""}</small></div></div>`;

function chips(){
  const tags=["Todas","♥ Favoritos",...new Set(HISTORIAS.flatMap(h=>h.etiquetas||[]))];
  $("chips").innerHTML="";
  tags.forEach(t=>{const b=document.createElement("button");b.className="chip"+(t===tag?" on":"");b.textContent=t;b.onclick=()=>{tag=t;chips();pintar()};$("chips").appendChild(b)});
}
function pintar(){
  const g=$("grid");g.innerHTML="";visibles=[];
  HISTORIAS.forEach((h,i)=>{
    if(tag==="♥ Favoritos"&&!fav.has(i))return;
    if(tag!=="Todas"&&tag!=="♥ Favoritos"&&!(h.etiquetas||[]).includes(tag))return;
    if(q&&!(h.titulo+" "+(h.etiquetas||[]).join(" ")).toLowerCase().includes(q))return;
    visibles.push(i);
    const d=document.createElement("div");d.className="libro";
    d.innerHTML=tapa(h,i)+`<button class="cor${fav.has(i)?" on":""}" title="Favorito">${fav.has(i)?"♥":"♡"}</button>`;
    d.onclick=()=>abrir(i);
    d.querySelector(".cor").onclick=e=>{e.stopPropagation();fav.has(i)?fav.delete(i):fav.add(i);guardar();pintar()};
    g.appendChild(d);
  });
  if(!visibles.length)g.innerHTML='<p class="vacio">No hay historias con ese filtro todavía.</p>';
}
$("q").oninput=e=>{q=e.target.value.toLowerCase();pintar()};
$("sorp").onclick=()=>{if(visibles.length)abrir(visibles[Math.floor(Math.random()*visibles.length)])};

function abrir(i){
  cur=i;const h=HISTORIAS[i];
  const min=Math.max(1,Math.round(h.texto.trim().split(/\s+/).length/200));
  $("ficha").innerHTML=tapa(h,i)+`<div class="info"><h2>${h.titulo}</h2><div class="aut">por ${h.autor||"—"}</div>
   <div class="etq">${(h.etiquetas||[]).map(t=>`<span>#${t}</span>`).join("")}</div>
   <div class="sin">${h.sinopsis||""}</div><div class="meta">≈ ${min} min de lectura</div>
   <div class="acc"><button class="empezar" id="ini">Comenzar a leer</button><button class="fv" id="fv"></button></div></div>`;
  const pf=()=>$("fv").textContent=fav.has(i)?"♥ En favoritos":"♡ Añadir a favoritos";pf();
  $("fv").onclick=()=>{fav.has(i)?fav.delete(i):fav.add(i);guardar();pf();pintar()};
  $("texto").innerHTML=`<h2>${h.titulo}</h2>`+h.texto.trim().split(/\n\s*\n/).map(p=>`<p>${p.replace(/\n/g,"<br>")}</p>`).join("")+`<div class="fin">✦ Fin ✦<br><button id="fin">Volver a la biblioteca</button></div>`;$("fin").onclick=()=>{$("volver").click();$("volver").click()};
  $("fichaWrap").style.display="block";$("cuerpo").style.display="none";$("ctl").style.display="none";$("prog").style.display="none";
  $("lector").classList.add("on");$("lector").scrollTop=0;document.body.style.overflow="hidden";modo="portada";
  $("ini").onclick=()=>{$("fichaWrap").style.display="none";$("cuerpo").style.display="block";$("texto").style.display="block";$("ctl").style.display="inline-flex";$("prog").style.display="block";$("prog").style.width="0";$("lector").scrollTop=0;modo="lectura";$("lector").classList.add("leyendo");$("ctl").classList.remove("oculto")};
}
$("volver").onclick=()=>{
  if(modo==="lectura"){$("fichaWrap").style.display="block";$("cuerpo").style.display="none";$("ctl").style.display="none";$("prog").style.display="none";$("lector").classList.remove("leyendo");$("lector").scrollTop=0;modo="portada";return}
  $("lector").classList.remove("on");document.body.style.overflow="";modo="home";
};
$("texto").onclick=()=>$("ctl").classList.toggle("oculto");let ult=0;$("lector").onscroll=()=>{const l=$("lector"),m=l.scrollHeight-l.clientHeight;const d=l.scrollTop-ult;if(Math.abs(d)>6){$("ctl").classList.toggle("oculto",d>0&&l.scrollTop>80);if(d>0)$("panel").classList.remove("on");ult=l.scrollTop}$("prog").style.width=(m>0?l.scrollTop/m*100:0)+"%"};

function tam(v){v=Math.max(14,Math.min(34,+v));$("rango").value=v;$("texto").style.fontSize=v+"px";try{localStorage.setItem("pw_tam",v)}catch(e){}}
$("rango").oninput=e=>tam(e.target.value);$("mas").onclick=()=>tam(+$("rango").value+2);$("menos").onclick=()=>tam(+$("rango").value-2);
function tema(t){$("cuerpo").className=t;document.querySelectorAll(".sw").forEach(b=>b.classList.toggle("on",b.dataset.t===t));try{localStorage.setItem("pw_tema",t)}catch(e){}}
document.querySelectorAll(".sw").forEach(b=>b.onclick=()=>tema(b.dataset.t));$("aab").onclick=e=>{e.stopPropagation();$("panel").classList.toggle("on")};document.addEventListener("click",e=>{if(!$("ctl").contains(e.target))$("panel").classList.remove("on")});
try{tam(localStorage.getItem("pw_tam")||20);tema(localStorage.getItem("pw_tema")||"t-noche")}catch(e){tam(20)}

/* pétalos en la paleta del mundo */
const cv=$("petalos"),cx=cv.getContext("2d");let pet=[];
const ajustar=()=>{cv.width=innerWidth;cv.height=innerHeight};addEventListener("resize",ajustar);ajustar();
const cols=["#8fd9bd","#b7bde8","#f4b9a6","#ea9fb8","#7fcbf0","#ecc979"];
const nuevo=()=>({x:Math.random()*cv.width,y:-20,r:5+Math.random()*7,v:.6+Math.random()*1.4,s:Math.random()*6,vs:.01+Math.random()*.03,a:Math.random()*6,va:(Math.random()-.5)*.05,c:cols[Math.floor(Math.random()*cols.length)],o:.5+Math.random()*.5});
function bucle(){
  cx.clearRect(0,0,cv.width,cv.height);
  const p=modo==="portada"?.25:modo==="home"?.05:0;
  if(Math.random()<p)pet.push(nuevo());
  pet=pet.filter(x=>x.y<cv.height+30);
  for(const x of pet){x.y+=x.v;x.s+=x.vs;x.x+=Math.sin(x.s)*1.2;x.a+=x.va;
    cx.save();cx.translate(x.x,x.y);cx.rotate(x.a);cx.globalAlpha=x.o;cx.fillStyle=x.c;cx.beginPath();cx.ellipse(0,0,x.r,x.r*.55,0,0,Math.PI*2);cx.fill();cx.restore()}
  requestAnimationFrame(bucle);
}
chips();pintar();bucle();
