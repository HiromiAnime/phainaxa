<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PHAINAXA WORLD</title>
<style>
:root{--menta:#8fd9bd;--lav:#b7bde8;--hielo:#7fcbf0;--dur:#f4b9a6;--rosa:#ea9fb8;--oro:#ecc979;--noche:#14172a;--noche2:#1f2444;--txt:#eef0ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:"Times New Roman",Times,serif;color:var(--txt);min-height:100vh;background:radial-gradient(ellipse at 15% 0%,rgba(143,217,189,.22),transparent 50%),radial-gradient(ellipse at 95% 8%,rgba(244,185,166,.28),transparent 55%),radial-gradient(ellipse at 50% 100%,rgba(183,189,232,.18),transparent 60%),#12152a fixed}
canvas#petalos{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
header{text-align:center;padding:44px 16px 14px}
h1{margin:0;font-weight:700;font-size:clamp(2.2rem,8vw,4.4rem);letter-spacing:.12em;background:linear-gradient(90deg,var(--menta),var(--lav) 45%,var(--dur) 80%,var(--oro));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(183,189,232,.35))}
.tools{max-width:1000px;margin:18px auto 0;padding:0 16px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.tools input{flex:1 1 220px;max-width:340px;padding:10px 18px;border-radius:999px;border:1px solid rgba(183,189,232,.4);background:rgba(255,255,255,.07);color:var(--txt);font:inherit;text-align:center}
.tools input::placeholder{color:#a9aed0}
.chip{border:1px solid rgba(183,189,232,.45);background:rgba(255,255,255,.06);color:var(--txt);border-radius:999px;padding:6px 15px;font:inherit;font-size:.95rem;cursor:pointer;transition:.2s}
.chip:hover{transform:translateY(-2px);border-color:var(--menta)}
.chip.on{background:linear-gradient(90deg,var(--menta),var(--lav));color:#14172a;border-color:transparent;font-weight:700}
.sorp{background:linear-gradient(90deg,var(--dur),var(--rosa));color:#2a1420;border:0;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:24px;max-width:1100px;margin:26px auto 60px;padding:0 18px}
.libro{cursor:pointer;position:relative;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.libro:hover{transform:translateY(-8px) rotate(-1.5deg)}
.tapa{position:relative;aspect-ratio:2/3;border-radius:16px;overflow:hidden;border:2px solid rgba(255,255,255,.35);box-shadow:0 10px 26px rgba(0,0,0,.5),0 0 0 3px rgba(183,189,232,.15)}
.libro:hover .tapa{box-shadow:0 14px 34px rgba(143,217,189,.35),0 0 0 3px var(--menta)}
.tapa img{width:100%;height:100%;object-fit:cover;display:block}
.tapa .vel{position:absolute;inset:auto 0 0 0;padding:30px 12px 12px;background:linear-gradient(transparent,rgba(14,16,34,.92));text-align:center}
.tapa h3{margin:0;font-size:1.08rem;color:#fff}
.tapa small{color:var(--menta);font-style:italic}
.cor{position:absolute;top:8px;right:8px;z-index:2;width:34px;height:34px;border-radius:50%;border:0;background:rgba(20,23,42,.7);color:#fff;font-size:1.1rem;cursor:pointer}
.cor.on{color:var(--rosa)}
.vacio{grid-column:1/-1;text-align:center;color:#a9aed0;font-style:italic}
#lector{position:fixed;inset:0;z-index:50;display:none;overflow-y:auto;background:#12152a}
#lector.on{display:block}
#prog{position:fixed;top:0;left:0;height:4px;width:0;z-index:70;background:linear-gradient(90deg,var(--menta),var(--lav),var(--dur));display:none}
.barra{position:sticky;top:0;z-index:55;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;background:rgba(18,21,42,.94);border-bottom:1px solid rgba(183,189,232,.3)}
.barra button,.barra select{background:rgba(255,255,255,.08);color:var(--txt);border:1px solid rgba(183,189,232,.5);border-radius:999px;padding:6px 14px;font:inherit;cursor:pointer}
.barra button:hover{background:var(--menta);color:#14172a}
.barra input[type=range]{accent-color:var(--menta);width:110px}
.barra select option{color:#000}
#ficha{display:flex;flex-wrap:wrap;gap:34px;justify-content:center;align-items:center;max-width:900px;margin:0 auto;padding:36px 22px 60px;min-height:85vh}
#ficha .tapa{width:min(250px,64vw)}
.info{flex:1 1 320px;max-width:480px}
.info h2{margin:0 0 4px;font-size:2.1rem;color:#fff}
.info .aut{color:var(--menta);font-style:italic;margin-bottom:14px}
.etq{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.etq span{background:rgba(244,185,166,.16);border:1px solid var(--dur);color:var(--dur);border-radius:999px;padding:3px 13px;font-size:.92rem}
.sin{background:rgba(255,255,255,.07);border-left:4px solid var(--lav);border-radius:12px;padding:14px 18px;line-height:1.6;margin-bottom:12px}
.meta{color:#a9aed0;font-size:.95rem;margin-bottom:18px}
.acc{display:flex;gap:12px;flex-wrap:wrap}
.empezar{background:linear-gradient(90deg,var(--menta),var(--lav));color:#14172a;border:0;border-radius:999px;padding:12px 30px;font:inherit;font-weight:700;font-size:1.1rem;cursor:pointer;box-shadow:0 6px 20px rgba(143,217,189,.35)}
.fv{background:transparent;color:var(--txt);border:1px solid var(--rosa);border-radius:999px;padding:12px 20px;font:inherit;cursor:pointer}
#texto{display:none;max-width:720px;margin:0 auto;padding:36px 22px 90px;line-height:1.8}
#texto h2{text-align:center;font-weight:400;margin-bottom:30px}
#texto p{margin:0 0 1.1em;text-align:justify}
#cuerpo{background:var(--bg);color:var(--fg);transition:.3s}
.t-noche{--bg:#000;--fg:#f2f2f2}.t-dia{--bg:#fff;--fg:#000}.t-vista{--bg:#f1e7d0;--fg:#3a2f20}
#cuerpo.t-noche #ficha,#cuerpo.t-dia #ficha,#cuerpo.t-vista #ficha{color:var(--txt)}
#fichaWrap{background:#12152a}
.leyendo .barra{display:none}
#ctl{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:65;flex-direction:column;align-items:flex-end;gap:10px;transition:transform .35s,opacity .35s}
#ctl.oculto{transform:translateY(100px);opacity:0}
#aab{width:52px;height:52px;border-radius:50%;border:0;font:700 1.15rem "Times New Roman",serif;background:linear-gradient(135deg,#8fd9bd,#b7bde8);color:#14172a;box-shadow:0 6px 20px rgba(0,0,0,.45);cursor:pointer}
#panel{display:none;background:rgba(24,28,54,.97);border:1px solid rgba(183,189,232,.5);border-radius:18px;padding:14px 16px;gap:14px;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#panel.on{display:flex}
.fila{display:flex;align-items:center;justify-content:center;gap:10px}
#menos,#mas{background:rgba(255,255,255,.1);color:#eef0ff;border:1px solid rgba(183,189,232,.5);border-radius:999px;padding:6px 12px;font:inherit;cursor:pointer}
#panel input[type=range]{accent-color:#8fd9bd;width:120px}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid #6b6f99;cursor:pointer;padding:0}
.sw.on{border-color:#8fd9bd;box-shadow:0 0 0 3px rgba(143,217,189,.35)}
.fin{text-align:center;margin-top:50px;opacity:.85}
.fin button{margin-top:14px;background:transparent;color:inherit;border:1px solid currentColor;border-radius:999px;padding:8px 22px;font:inherit;cursor:pointer}
</style></head>
<body>
<canvas id="petalos"></canvas>
<header><h1>PHAINAXA WORLD</h1>
  <div class="tools"><input id="q" placeholder="Buscar historia…"><button class="chip sorp" id="sorp">✦ Sorpréndeme</button></div>
  <div class="tools" id="chips"></div>
</header>
<main class="grid" id="grid"></main>

<section id="lector">
  <div id="prog"></div>
  <div class="barra">
    <button id="volver">← Biblioteca</button>
  </div>
  <div id="fichaWrap"><div id="ficha"></div></div>
  <div id="cuerpo" class="t-noche"><article id="texto"></article></div>
</section>

<div id="ctl" style="display:none">
  <div id="panel">
    <div class="fila"><button id="menos">A−</button><input type="range" id="rango" min="14" max="34" value="20"><button id="mas">A+</button></div>
    <div class="fila"><button class="sw" data-t="t-noche" style="background:#000" title="Fondo negro"></button><button class="sw" data-t="t-dia" style="background:#fff" title="Fondo blanco"></button><button class="sw" data-t="t-vista" style="background:#f1e7d0" title="Cómodo para la vista"></button></div>
  </div>
  <button id="aab" title="Letra y fondo">Aa</button>
</div>

{titulo:"a world meant for you",autor:"Yuteeee",sinopsis:"Anaxágoras, el gran intérprete. Cuando se tope con la verdad de este mundo, ¿cómo reaccionará? Sin duda, se reiría. Si aquello que ha buscado durante toda su vida cayera finalmente en sus manos, lo sacrificaría todo. ¿Verdad? Pero, cuando esa verdad le obligue a hacer daño a sus seres queridos, ¿cómo reaccionará? No quiere saberlo; porque, ahora mismo, mientras su compañero se encuentra en la plenitud de su vida, él se niega a hacerle daño. Entonces, ¿qué debería hacer cuando él mismo es la razón por la que este mundo se ha convertido en lo que es?",etiquetas:["Anaxa is Bad at Feelings","Anaxa soft"],texto:`Se dice que los recuerdos de miles de personas pueden dar lugar a una civilización. Estas personas construirán, crearán y, finalmente, llegarán a la razón, como polillas atraídas por una llama. Pero eso nunca es suficiente. Todas las civilizaciones terminan en destrucción. Debido a que no pueden mantenerse dentro de sus límites, todo se desmorona. Y entonces la historia se vuelve inútil: no queda nadie para aprender de ella. Años de conocimiento convertidos en polvo, todo porque la llama ardió con demasiada intensidad, con demasiada ferocidad... y no pudieron evitar volar directamente hacia ella.</p>
<p>"Phainon, ¿por qué no estás con Nax?" Se le acercó una chica alegre, con una mano presionada contra la oreja para evitar que su cabello volara salvajemente con el viento. La forma en que hablaba fue suficiente para que el hombre la mirara y sonriera suavemente.</p>
<p>El chico estaba sentado en la hierba, observando a los pájaros alejarse volando, con los oídos llenos de sus cantos, pensando en este momento de paz. "No lo llames así cuando estés con él..."</p>
<p>Cyrene siente algo extraño, pero no sabría decir qué. "No te preocupes, no me dirá nada". Su voz era juguetona, como si no pasara nada malo.</p>
<p>Él sonrió suavemente, "Está en su estudio haciendo experimentos... Estoy preocupado, pero no me deja entrar". Sus labios temblaron levemente, sus dedos clavándose en su piel.</p>
<p>Ella lo observó con una pequeña sonrisa en su rostro, aunque en el fondo, quería suspirar fuerte. Su mano le palmeó la espalda, tratando de tranquilizarlo como siempre, con una cálida sonrisa y alguien que lo acompañara, pero esa no era la razón por la que estaba aquí.</p>
<p>"Cyrene, tú... ¿De verdad tenemos que ir a Okhema? Anaxa es feliz aquí. Solo quiero quedarme con ustedes dos..." Phainon miró hacia el cielo mientras hablaba. La luz del sol iluminó su rostro; cerró los ojos, luego volvió a bajar la cabeza, con las mejillas ligeramente sonrojadas por el miedo a decirlo.</p>
<p>Y ella sabía que él no quería decepcionarla al decirlo. Pero al mismo tiempo, estaba enamorado, y ese amor le hacía querer proteger a la persona que le importaba. Poco sabía que el que amaba no quería esto: que renunciara a sus sueños por su culpa.</p>
<p>"La profecía, uh... Si no quieres ir, está bien, Nax y yo estamos aquí para ti". El quiebre en su voz era apenas audible, pero la forma en que movió su rostro para que él no pudiera verla fue obvia.</p>
<p>En ese momento, un hombre con cabello color menta apareció detrás de ellos, su expresión severa se suavizó en el instante en que los vio a los dos. Casi se le caen los papeles que tenía en la mano, pero no lo hizo. Su ojo izquierdo estaba envuelto en vendajes, que cambiaba regularmente debido a los experimentos que realizaba en su propio cuerpo.</p>
<p>Con un suave suspiro, dice: "¿De qué están hablando ustedes dos?"</p>
<p>Al escuchar esa voz, Phainon se da vuelta, su expresión pasando de sombría a alegre en cuestión de segundos. "¡Anaxa!"</p>
<p>"Antes que nada, es Anaxágoras". Soltó una risa burlona. "¿Cuántas veces tengo que repetir eso?" Su rostro se suavizó mientras acariciaba suavemente la cabeza de Phainon antes de sentarse a su lado.</p>
<p>"Eso no importa". Pero mientras lo decía, podía sentir la mirada de Anaxa. "Quiero decir, sí, ¡pero soy tu pareja!"</p>
<p>Anaxa apoyó la cabeza en el hombro de Phainon mientras miraba los papeles. Su cabello color menta rozó la piel de Phainon, y él no podía dejar de mirarlo.</p>
<p>Phainon se sintió lleno de risitas por dentro. El leve aroma a menta era refrescante, y era el olor que se quedaba con él.</p>
<p>"Aww, tortolitos~♪" arrulló Cyrene, observándolos con las manos en las mejillas.</p>
<p>Anaxa le dirigió una mirada rápida, sonriendo levemente antes de volver a los papeles que tenía en la mano. Mientras leía, frunció el ceño y movió un poco la cabeza, claramente pensando.</p>
<p>Phainon podía sentir la duda en los ojos de su querido profesor. "¿Pasa algo malo?"</p>
<p>Él lo miró por un momento, luego se volvió hacia Cyrene y asintió levemente. Ella pareció entender que él quería hablar. Entonces, ella asintió también.</p>
<p>"No es nada... Lo siento, tengo un poco de sueño", sonrió suavemente mientras Phainon lo miraba con rostro preocupado. Aunque cuando dijo eso, suspiró, un poco aliviado.</p>
<p>Cyrene le quitó los papeles de las manos a Anaxa y silbó en broma. Sus ojos reflejaban a los dos hombres frente a ella. Se reían y jugaban, y ella no pudo evitar reírse cuando Phainon puso sus manos en la cintura de Anaxa.</p>
<p>"Qué romántico~♪"</p>
<p>Phainon mira la hoja de papel en las manos de Cyrene. "Ese es Anax-"</p>
<p>"No importa, Phainon". Él suspiró. "¿De verdad estás tan aburrido que prefieres concentrarte en un pedazo de papel en lugar de mí? ¿Mmm?" Anaxa levantó la cabeza; su rostro casi tocaba el de Phainon, y sus labios rozaron los de él.</p>
<p>Al verlo, Phainon se sonrojó, no tanto por vergüenza, sino porque ver a Anaxa seguir el juego con tanto afecto era raro. Y por supuesto, no iba a desaprovechar la oportunidad.</p>
<p>Suavemente, pasó un brazo alrededor de su cintura y lo levantó, acomodándolo sobre sus muslos. Sintiéndose un tanto manipulado, Anaxa se tensó, aunque perdió parte de su dignidad al sonrojarse bajo el toque. "Tú... qué astuto".</p>
<p>Phainon vio el sonrojo y sonrió burlonamente. "Profesor... ¿se está sonrojando?"</p>
<p>"...Oye, ¿qué estás haciendo...?"</p>
<p>El hombre de cabello blanco sonrió, con las manos aún descansando en la cintura de Anaxa. Lo atrajo más cerca, hasta que sus cuerpos se tocaron y sus rostros estuvieron muy cerca.</p>
<p>"Sabes, hemos estado saliendo por mucho tiempo, y nunca haces nada..."</p>
<p>Pero esta vez estabas haciendo algo. Eso es lindo.</p>
<p>"Eso es"</p>
<p>Bueno, para ser honesto, Anaxa ni siquiera se había dado cuenta de que no estaba haciendo nada. ¿Cómo se suponía que debía actuar con alguien a quien amaba? Solo la idea del afecto le recordaba a su hermana, pero no había pasado suficiente tiempo con ella para saber qué significaba eso.</p>
<p>"Uh, bueno, sabes, realmente no tengo ganas de hacer este tipo de cosas contigo..."</p>
<p>Ah, eso sonó mal.</p>
<p>"Pero no es como si lo odiara. Está bien... ¿sí?" No era el mejor expresando sus emociones, pero quería sonar gentil. En cambio, su tono sonó serio, como si realmente lo dijera en serio.</p>
<p>Al escuchar eso, Phainon dejó de acariciar su cintura y dejó escapar un largo suspiro. Lo había esperado. Anaxa era ese tipo de persona...</p>
<p>En el fondo, había esperado una respuesta diferente.</p>
<p>Sabía que Anaxa lo amaba.</p>
<p>Pero de alguna manera... todavía no era suficiente.</p>
<p>Pasaron las siguientes horas acostados así, envueltos en la comodidad del otro. Anaxa, aunque un poco avergonzado, no se apartó. Phainon se contuvo, no por vacilación; quería apreciar este momento de rara intimidad entre los dos.</p>
<p>Anaxa era una persona solitaria que a menudo lo enmascaraba con 'trucos': palabras ingeniosas y sonrisas distantes. Era algo que Phainon quería cambiar, pero una fachada que había estado en su lugar durante tanto tiempo no podía derribarse tan fácilmente.</p>
<div class="separator">✦ ❖ ✦</div>
<p>Debajo del árbol estaba sentada Cyrene, rodeada por un pequeño enjambre de niños que no paraban de llamarla "hermana". Les enseñó pacientemente a leer, trazando letras en la tierra con un palo, con su voz suave pero firme. Entre lecciones, jugaban a juegos tontos y tiraban de sus mangas para llamar su atención. Cuando sus risas se desvanecieron en curiosidad, los entretuvo con pequeñas fortunas: predicciones suaves contadas con un brillo en los ojos y una sonrisa que hacía difícil saber si hablaba en serio. Algunos le creyeron; a otros simplemente les gustaba fingir. De cualquier manera, escuchaban.</p>
<p>"Cyrene".</p>
<p>Un hombre apareció aparentemente de la nada. Los niños tiraron de las mangas de Cyrene, pero ella solo sonrió y les acarició la cabeza, guiándolos suavemente para que fueran a jugar a otra parte.</p>
<p>Anaxa notó que sus ojos se demoraban en él, feroces y protectores. Se burló en voz baja; después de todo, solo eran niños.</p>
<p>"¡Nax, deja de hacer eso, por eso te tienen miedo!" gritó ella con voz juguetona.</p>
<p>"Incluso si tienen miedo, seguirán dejando que les enseñe, así que, ¿cuál es el problema?" Sus ojos se posaron en los niños por un momento antes de mirar a Cyrene nuevamente.</p>
<p>"¡Uhm! Realmente eres alguien especial". Se burla. "De todos modos, ¡confío en que me llamaste por una buena razón!"</p>
<p>"Ah, créeme, te llamé aquí por una buena razón", sonrió. "Supongo que leíste esos papeles; fue un pequeño experimento que hice hace un tiempo, y recientemente tuve la oportunidad de enviarlo a la Arboleda. Ayer me lo enviaron, así que pasé todo el día leyéndolo hasta que llegué a esa parte que marqué".</p>
<p>"Fue interesante", continuó, "y me di cuenta de que no era el único que sentía algo extraño al respecto, así que... ¿Qué piensas al respecto, Cyrene?"</p>
<p>Un largo silencio los siguió. Anaxa no estaba seguro de qué debía esperar; después de todo, se trataba de una acusación sin pruebas.</p>
<p>Una mano cálida le palmeó el hombro. Ella se reía por lo bajo: "¿En serio, todo este secretismo solo por eso? No sé cómo explicarlo... Sin embargo, si me das algo de tiempo, creo que podré darte una respuesta satisfactoria".</p>
<p>"Algo de tiempo... Pero, ¿no te vas a estudiar al extranjero?"</p>
<p>Vio su rostro incómodo y no preguntó más, solo suspiró con una expresión en blanco.</p>
<p>Y ella solo se burla: "Sabes, también eres un gran tonto".</p>
<p>"¿Oh? ¿Razones?"</p>
<p>"Eres el mayor de todos nosotros, pero cuando se trata de cosas simples como decir lo que tienes en mente, actúas como un niño pequeño. Entiendo tus circunstancias, pero es simplemente... malo. Phainon tiene toda la paciencia del mundo contigo, pero también es humano, así que probablemente te ve como algo que necesita proteger, como a una muñeca rota".</p>
<p>Se puso un dedo en la barbilla como si estuviera pensando en lo que acababa de decir.</p>
<p>"¿O tal vez ustedes dos están frustrados...?"</p>
<p>"...¿Qué?" Anaxa la miró con una pizca de disgusto.</p>
<p>Ella lo miró fijamente, su mano dejó de palmearle la espalda. "¿Eh? ¿Es eso? Estaba bromeando... No pensé que ustedes dos no-"</p>
<p>"No digas una palabra más..." La vergüenza en su voz era tan obvia que Cyrene se sintió tentada a seguir molestándolo.</p>
<p>Él toma un respiro para relajarse, su expresión se vuelve más seria. "Bueno, no tengo que hablar de eso contigo, Cyrene. Solo quiero asegurarme de que no repetirás nada de lo que te diga... a él".</p>
<p>"No te preocupes". Ella comenzó a caminar por el campo de trigo. A veces, su expresión era más seria de lo habitual, haciendo que Anaxa se sintiera extraño.</p>
<p>Las bromas entre ellos se desvanecieron cuando comenzaron a caminar; ninguno de los dos dijo una palabra. Ella era del tipo que hacía bromas ligeras y actuaba llena de sí misma, pero así era ella. No necesitaba enseñarle nada. Eran amigos... si es que siquiera podía llamarlo así.</p>
<p>Tenía la mano presionada contra la cara. Los rayos de luz se derramaron sobre su silueta, como si intentaran envolverla por completo. Brillaba en ese escenario, como si fuera algo más que una simple persona en este mundo.</p>
<p>Se dio la vuelta, el trigo contrastando con el rosa de su figura. La luz del sol la envolvía como un suave velo, arrojando un brillo dorado sobre su piel. La sonrisa en su rostro era solitaria, tenue, como si la hubiera tomado prestada de un viejo recuerdo, y la mirada de sus ojos era cautivadora, frágil y vasta. Se sintió como un niño viendo el mar por primera vez: abrumado, pequeño y sin aliento ante algo tan hermoso y distante.</p>
<p>"Me hubiera gustado conocer a tu hermana, estoy segura de que era una belleza~"</p>
<p>La miró a los ojos, tan brillantes, pero tan dolorosamente solitarios, y luego se rió, suavemente, como si algo hubiera hecho clic dentro de él. El viento se llevó los pensamientos que tenía, esparciéndolos como polvo a la luz del sol. Solo quedó su sonrisa. "Sí", murmuró, "estoy seguro de que a ella también le hubiera gustado eso".</p>
<div class="separator">✦ ❖ ✦</div>
<p>Normalmente, Anaxa enseñaría a los niños de la aldea cosas que podrían serles útiles en el futuro, pero el estrés lo está consumiendo. Enseñar a los niños es más estresante que lidiar con Phainon, y eso es decir mucho.</p>
<p>"Profesor..." Una voz débil llegó a su oído mientras se frotaba la sien; le palpitaba la cabeza.</p>
<p>Vio el rostro del hombre frente a él; estaba algo inquieto. Phainon quería decir algo, pero como siempre, él lo ignoró, o al menos intentó hacerlo.</p>
<p>Pero esta vez no puede hacerlo.</p>
<p>"Huh, habla". Intentó no sonar tan burlón, "Espero algo interesante".</p>
<p>Los ojos de Phainon se iluminaron con curiosidad. "Sé que no crees en los Titanes, pero... nunca pregunté por qué". Tragó saliva con dificultad. "¿De dónde viene eso?"</p>
<p>¿Es esto... una tontería?</p>
<p>Anaxa lo miró, pensando si debía continuar con esta charla. "¿Por qué quieres saber?"</p>
<p>La forma en que había suplicado a los Titanes, con su pequeño cuerpo desgarrado por las heridas, su rostro empapado en lágrimas mientras se arrastraba por el suelo, era algo que nunca olvidaría. La decepción de darse cuenta de que, al final, no significaba nada para ellos.</p>
<p>"...¿Por qué?" Phainon tembló ante la pregunta directa. "Obviamente, es porque quiero saber más sobre ti..."</p>
<p>Anaxa no era estúpido. Tal vez para Phainon parecía una persona amable e inocente, pero él sabía la verdad.</p>
<p>Se sienta frente a él con las piernas cruzadas, sus labios curvándose en una sonrisa de suficiencia. Anaxa sintió la incertidumbre en la voz de Phainon, así que con su comportamiento habitual, habló.</p>
<p>"Deja eso en paz, tu búsqueda de conocimiento está manchada por otras cosas que no me interesa saber". Dio dos pasos adelante, colocando su dedo índice bajo la barbilla de Phainon.</p>
<p>"En cambio, quiero preguntarte algo".</p>
<p>"¿Estás seguro de quedarte aquí?"</p>
<p>"¿Uh?" Miró hacia arriba, sus ojos estaban confundidos y sus labios temblaban levemente. "¿A... a qué te refieres?"</p>
<p>La luz se posó en sus ojos, y Phainon tembló. Miró a los ojos de su querido amante y vio anhelo; era... tan extraño. Todo esto lo dijo alguien a quien ama y cree conocer, pero tal vez Anaxa lo conozca mejor de lo que piensa.</p>
<p>Y es por eso que Phainon se siente culpable, porque, a pesar de todo, sigue ocultándole cosas.</p>
<p>"Sé que siempre dices que quieres vivir aquí, pero. También veo cómo miras los barcos que parten hacia la ciudad, cómo faltas a mis clases para entrenar y crees que no me doy cuenta". El hecho de que enfatizara sus clases le provocó un tic.</p>
<p>"Aunque no estoy dolido. Puedes continuar si deseas ser un héroe".</p>
<p>Un sonido llenó la habitación. Phainon se puso de pie abruptamente y agarró los hombros de Anaxa con fuerza. Ante eso, su cabello color menta se soltó y apretó los dientes; sus ojos estaban tensos por la brusquedad que mostró Phainon.</p>
<p>"¡Profesor! ¡No, Anaxa! ¿¡Qué quieres decir con eso!?" Cuando se dio cuenta de que estaba siendo demasiado brusco, chasqueó la lengua y dio un paso atrás.</p>
<p>Anaxa se frotó el hombro; no quería enfadarse con él. "Cálmate. En primer lugar, solo digo la verdad. Si quieres, adelante".</p>
<p>"Yo... Lo siento, pero ya te lo dije. Quiero quedarme aquí con ustedes dos". Estaba seguro de eso, ¿verdad?</p>
<p>"Ese no es un deseo, Phainon". Estaba seguro. Cyrene le contó sobre esa promesa; él quería salir, no quedarse aquí.</p>
<p>Phainon cambió su deseo por su culpa; quería ser un héroe para su hogar, pero si algo pasaba, si Anaxa estaba en peligro, ¿estaba realmente seguro de querer protegerlos? No estaba seguro. Amaba este lugar, amaba a sus amigos y amaba a Anaxa. Pero...</p>
<p>"Es un deseo, ¿qué tiene de malo?"</p>
<p>Era un amor que lo consumía.</p>
<p>"¿Qué pasa, preguntas?" Él se ríe entre dientes, "No quiero, ni necesito tu protección".</p>
<p>"Pero, ¿y si alguien se aprovecha de ti mientras estoy fuera?" Camina y pone su mano en la mejilla de Anaxa. Su voz estaba ligeramente quebrada.</p>
<p>Anaxa lo miró en estado de shock, '¿de qué está hablando este hombre?' pensó.</p>
<p>"¿Estás dudando de las personas con las que has vivido toda tu vida?" La mano en su mejilla se tensó. Phainon lo miró con un rostro sombrío. Dejó caer su cuerpo hacia adelante, abrazando a Anaxa. "No es eso... solo estoy preocupado".</p>
<p>El cuerpo que lo abrazaba era cálido, pero su hombro estaba mojado: el hombre encima de él estaba sollozando, y él simplemente se quedó allí.</p>
<p>Phainon estaba temblando; acababa de decir una estupidez, y Anaxa lo sabía.</p>
<p>Las suaves palmadas en su cabeza solo lo hicieron llorar más fuerte, sollozando por más.</p>
<p>Pero Anaxa no podía soportarlo; él también necesitaba un descanso. Aunque intentó parecer indiferente, en el momento en que se apartó de Phainon, su fachada casi se resquebraja. No podía soportar ver a este chico, alguien tan brillante y hermoso, destrozado de esta manera.</p>
<p>Solo quedaba uno en la habitación: Phainon. Seguía sollozando, repitiendo lo que le había dicho a Anaxa. Sabía que podría haber sido malo, realmente malo, pero tal vez solo era la adrenalina hablando. Sí... eso podría ser, ¿verdad?</p>
<p>"¿Podría ser que mi forma de amar es... incorrecta?"</p>
<p>"No hay una forma correcta de amar, Phainon". Cyrene apareció de repente, estaba sonriendo y lista para pellizcar la mejilla de Phainon, hasta que lo vio sollozando.</p>
<p>"¿Podría ser... te peleaste con Nax?" Phainon la miró; sus ojos estaban rojos y no quería hablar.</p>
<p>"Lo vi con una expresión de frustración, ¿o era una cara deprimida?" Ella continuó balbuceando sus pensamientos. "De cualquier manera, puedes hablar conmigo, te escucharé~"</p>
<p>Phainon no dijo nada, lo que hizo que Cyrene se sintiera incómoda. "¡Vamos! Siempre eres como un adolescente enamorado. ¿Qué tan malo pudo ser lo que dijo para hacerte sentir así?"</p>
<p>"Dijo que no me necesita". Su dolor era notable en la forma en que hablaba; ni siquiera estaba enojado con Anaxa, estaba enojado consigo mismo, por no entender lo que quería decir con todo esto.</p>
<p>Pero seguía echándole la culpa a Anaxa, no porque realmente lo creyera, sino porque si no lo hacía, temía que la culpa lo destruyera.</p>
<p>"Sabes", deslizó sus dedos por su cabello, "él no quiere que dejes de lado nada que te haga ser tú, por él".</p>
<p>"Puede que sea un tonto, pero se preocupa". Su voz era tranquila mientras acercaba una silla y se sentaba a su lado.</p>
<p>"Desde el momento en que lo miraste así... lo supe. Incluso cuando te alejó, te quedaste". Dejó escapar un largo suspiro, casi cansado. "Él se burla de tu sueño de ser un héroe, siempre con esa sonrisa de suficiencia... pero te observa cuando entrenas, como si te estuviera memorizando. Intentó cocinar para ti una vez, le salió horriblemente mal, pero en lugar de admitirlo, simplemente fingió que no importaba".</p>
<p>Ella sonrió débilmente. "Pero sí importó".</p>
<p>"De todos modos, deberías hablar con él", dijo, dándole una suave palmada en la espalda. "O tal vez... tomarte un tiempo. Necesitas pensar bien las cosas".</p>
<p>Phainon se demoró en sus palabras; imaginar a Anaxa lidiando con algo desconocido trajo una calidez tranquila a su pecho.</p>
<div class="separator">✦ ❖ ✦</div>
<p>El tiempo pasó como el viento: suave, implacable. Pero el peso en sus corazones permaneció intacto.</p>
<p>Entre ellos, el silencio floreció como una flor de dolor, y una chica observaba desde lejos, con ojos sabios. Ninguno vio cómo el dolor en sus pechos podría aliviarse, si tan solo se atrevieran a decir las palabras atrapadas detrás de sus labios.</p>
<p>La chica se balanceaba debajo del árbol, tarareando una canción de cuna para nadie. Sus dedos de los pies apenas rozaban la plataforma de madera de abajo, pero insistía en regresar a este lugar, aunque ya era demasiado mayor para ello.</p>
<p>En medio de todo, una voz delicada llegó a sus oídos, destinada a otra persona, pero que encontró su camino hacia ella.</p>
<p>"Yo-Cyrene, quiero preguntarte algo".</p>
<p>Cuando se volvió, vio el rostro de Anaxa, ligeramente contorsionado, mostrando exactamente lo que había estado en su mente estos últimos días.</p>
<p>"¿Mmm?" Sus labios se curvaron en una sonrisa burlona. "¡No puede ser! ¿De verdad vas a preguntarme algo?"</p>
<p>No pasó ni un segundo más en el columpio. Sus pies tocaron la madera debajo, y con silenciosa determinación, el sonido de sus pasos llegó hasta él.</p>
<p>"Bueno, parece que sabes más sobre este tipo de cosas. Después de todo, ¿no es de lo que a las chicas les gusta hablar?"</p>
<p>"¿Ehh? ¿Debería llevarte a una charla de chicas?♪"</p>
<p>"... No, gracias". Se puso una mano sobre la boca; no quería pensar en ello.</p>
<p>"¡Por qué pones esa cara!" Ella jadeó. "No es que estés interesado en las mu-"</p>
<p>"Cyrene". La interrumpió.</p>
<p>Ella suspiró, parecía que las bromas eran un gran no por el momento, incluso si en realidad no había estado bromeando.</p>
<p>"Bueno, por lo que pude ver, parece que Phainon te está evitando, ¿verdad?" Sus ojos miraron el campo de trigo por un segundo. "Cualquier cosa que quieras discutir con él, tiene que ser directa. Es lento pero no estúpido".</p>
<p>Chasqueó la lengua; la evitación de Phainon ni siquiera era sutil. La incomodidad entre ellos era palpable, y ser el primero del otro solo complicaba más las cosas. Ninguno de los dos sabía cómo manejar esto.</p>
<p>Tuvieron suerte de que a la gente de Aedes Elysiae no le importara su cercanía; Anaxa sabía muy bien cómo trataba la gente generalmente cualquier cosa fuera de la norma, cualquier cosa que no fuera normal.</p>
<p>"Tal vez sea un poco estúpido..." suspiró fuertemente, "no es la primera vez que peleamos por algo como esto, pero es la primera vez que me ignora tanto. Realmente no soy adecuado para él, eh".</p>
<p>Cyrene, que solo estaba escuchando, lo interrumpió. "Entonces ustedes dos son una pareja hecha en el cielo". Podía sentir la mirada de Anaxa en ella, pero no le importaba, como siempre. "Mnestia probablemente se estaba riendo cuando Cerces les dio su bendición".</p>
<p>Anaxa le dirigió una mirada feroz, pero ella la ignoró como siempre.</p>
<p>"Me dijo que no cree ser lo suficientemente bueno para alguien como tú. Dijo que si pudiera leer mejor las expresiones, su relación podría mejorar y no tendrían que pelear tanto". Ella sonrió, "ustedes dos siempre aprenden el uno del otro, ¡así que estoy bastante triste! ¡Ya sea porque está huyendo o porque no lo persigues!" Le da una palmada en la espalda, con una mirada tristemente juguetona en su rostro.</p>
<p>Anaxa la miró, su mano encontró su camino hacia su cabello, alborotándolo suavemente. Cyrene captó una suave sonrisa en su rostro, no destinada a burlarse, sino nacida de un consuelo genuino.</p>
<p>"No quiero que Phainon se rinda, pero sé cómo es. Así que... considera esto una petición: ¿estarías dispuesta a venir con nosotros?"</p>
<p>"¿Petición? Bueno, si lo dices de esa manera~" Su actitud juguetona estaba al máximo. "Voy a ignorar el hecho de que planeaba ir sin ustedes dos, pero ahora que eres tan amable de pedírmelo..."</p>
<p>"Bueno, en ese caso, ahora estás atada a nosotros".</p>
<p>Ella hace un puchero, pellizcándole la mejilla. "¡Eso no es cierto! ¡Sin mí, estoy segura de que estarían perdidos!"</p>
<p>Honestamente, eso es cierto.</p>
<p>"Está bien, lo que tú digas". Puso los ojos en blanco. "Voy a hablar con él, y probablemente nos iremos en unos días".</p>
<p>¡Pero ella quería saber! Solo hablan de lo que sienten, no de su vida amorosa; se moría de curiosidad.</p>
<p>"¡¡Mmmm!! Oye, Nax~" Le tiró de la manga. "Tienes que contarme, ¿¡sí!?"</p>
<p>"Lo pensaré". Se aleja, agitando la mano.</p>
<p>Anaxa estaba buscando a Phainon, corriendo, a pesar de no tener casi nada de resistencia. Los niños lo vieron y no pudieron evitar sentir un poco de pena por él. ¿Estaba corriendo? Fue tan inesperado que incluso las abuelas se unieron para ayudarlo a buscar a Phainon.</p>
<p>Estaba jadeando; le ardía la garganta con cada respiración. Necesitaba agua, pero más que nada, lo necesitaba a él. El cansancio pesaba sobre él, y en ese momento, se hizo una promesa silenciosa: si lo encontraba, lo besaría allí mismo. Por supuesto, eso era un poco vergonzoso. Así que probablemente no lo haría.</p>
<p>Justo cuando estaba a punto de rendirse, vio a un hombre de cabello blanco acostado en el campo de trigo. El hombre miraba silenciosamente al sol, su cuerpo medio hundido en tallos dorados. Luego, como si fuera demasiado cegador, demasiado lejano, echó la cabeza hacia atrás y cerró los ojos.</p>
<p>Anaxa observó la escena, su respiración entrecortada, su garganta seca. Sin embargo, cada paso que daba por el sendero hacia él se sentía extrañamente refrescante, como si su fuerza estuviera regresando lentamente. Y luego, como si el viento mismo le diera la bienvenida, una suave brisa rozó su piel, llenándolo con una tranquila y abrumadora sensación de alivio.</p>
<p>Corrió hacia esa deslumbrante figura, le dolían las piernas, le dolían mucho, pero en ese momento, eso no importaba, porque todo lo que quería era ver el rostro de esa persona y preguntarle algo.</p>
<p>"... Phainon", su cuerpo no podía avanzar. Finalmente se cayó, sus manos agarrando la hierba debajo de él, "¿cuál es tu sueño?"</p>
<p>Esa delicada voz lo trajo de vuelta a la realidad, una donde las cosas seguían tensas entre ellos. Se sentó y miró a Anaxa, pero por alguna razón, no podía ver su rostro. ¿Por qué?</p>
<p>"Te lo dije, ¿no?" una voz quebrada escapó de sus labios, formando una sonrisa.</p>
<p>"Y ya te dije mi opinión". Anaxa se arrodilló frente a él. "Eso es absurdo. No quieres hacer eso".</p>
<p>Tomó la mano de Anaxa y la colocó contra su mejilla. La expresión del otro hombre se estremeció, lo suficiente para que Phainon sonriera. Trazó los nudillos de Anaxa con su dedo; había extrañado esto, incluso si él había sido el que huía.</p>
<p>"Hn, lo sé". Rozó sus labios contra los nudillos de Anaxa. "Pero, el hecho de que minimices mi esfuerzo por protegerte... eso también duele".</p>
<p>"Soy mayor que tú". Sus ojos se suavizaron ante la acción. "Aprecio tu esfuerzo, pero no te pedí que lo hicieras por mí".</p>
<p>Algo ilegible parpadeó en los ojos de Phainon. "Solo quiero... proteger a mis seres queridos. ¿Es eso malo?"</p>
<p>"No es malo, es aburrido". Suspira. "Eres más que eso".</p>
<p>"Pero... tal vez no sea tan malo ayudarte". Anaxa lo miró profundamente a los ojos. "No soy la gran persona que crees que soy. No sé qué hacer cuando nos peleamos por cosas pequeñas y estúpidas, ni entiendo por qué estás tan obsesionado conmigo. Pero si realmente quieres estar a mi lado, entonces vayamos y aprendamos juntos, ¿de acuerdo?"</p>
<p>Los ojos de Phainon comenzaron a llenarse de lágrimas. Anaxa lo conocía demasiado bien; podía decir que Phainon quería arrojarse a sus brazos en ese mismo momento. Nunca se había permitido creer que realmente podría tener todo lo que quería.</p>
<p>Los sollozos escaparon de sus labios y nariz, crudos y desordenados. Fue abrumador.</p>
<p>"Está bien, puedes hacer lo que quieras. Estoy aquí para ti". Sus dedos peinaban el cabello de Phainon, tan gentiles como su voz.</p>
<p>"Anaxa", dijo, como si su vida dependiera de ello. "Realmente, realmente te amo".</p>
<p>"Lo sé."</p>
<p>"Por favor déjame caminar por este camino contigo. Quiero estar a tu lado, sin importar a dónde lleve". Enterró su rostro en la cintura de Anaxa, envolviendo sus brazos alrededor de él.</p>
<p>"Sí, deberíamos".</p>
<p>En este momento de paz, todavía hay cosas que no se dicen, pero eso es algo de lo que pueden hablar más tarde. Después de todo, el tiempo es algo que tienen.</p>
<p>Phainon todavía es inseguro y tímido, pero el beso de quien ama hizo que todo eso se desvaneciera, aunque solo fuera por un momento.</p>
<p>Tal vez puedan arreglar lo que está roto y encontrar la felicidad. Todo estaría bien... si tan solo este mundo se lo permitiera.</p>
<p>Anaxa no estaba tan emocionado de salir, pero ver las caras de esos dos hizo que su corazón se ablandara. Comenzó a hablar con los vecinos que ya habían salido, tal vez podría recopilar información sobre los lugares allí.</p>
<p>Así que se fueron, Phainon claramente emocionado, aunque había una pizca de tristeza en su despedida al lugar que llamaba hogar. Cyrene, como de costumbre, no estaba muy molesta, deslizando el comentario o broma ocasional. Y Anaxa... bueno, tenía la tarea de cuidarlos en el camino.</p>
<p>Cuando llegaron a la gran ciudad, incluso Anaxa se quedó sin palabras; había una clara diferencia entre un pueblo y una ciudad. Tan hermosa como era Aedes Elysiae, este lugar se sentía demasiado brillante, demasiado moderno.</p>
<p>Tenían un plan, y era simple: Cyrene iba a estudiar en Janupolis, Phainon iba a Castrum Kremnos, y Anaxa, bueno, ¿quién sabe?</p>
<p>Y era un hombre de palabra. Quería terminar esto rápidamente para poder ir a la Arboleda de la Epifanía; su hermana le había dicho que visitara ese lugar en aras de un futuro mejor. Tal vez allí, podría encontrar la respuesta que estaba buscando.</p>
<p>"Cyrene, Phainon, me iré ahora".</p>
<p>Una mano agarra su muñeca; era de Phainon.</p>
<p>"Uh, ¿puedes quedarte aquí unos minutos más?" Sus labios temblaban, sus ojos fijos en Anaxa, y su mano comenzó a sudar.</p>
<p>Molesto.</p>
<p>"Sí, Nax~" Cyrene envolvió su brazo alrededor del de él. "¡Además, no estuvimos aquí por más de diez minutos!"</p>
<p>"... No necesito su permiso". Suspira. "Pero, bueno, tienen razón..." Aunque su voz aún guardaba un rastro de duda.</p>
<p>Con un pequeño tirón en el cuello de su vestido, Phainon le lanzó una mirada irritada.</p>
<p>Cyrene se quedó momentáneamente sorprendida, pero la mirada en su rostro la hizo reír; siempre le ganaba.</p>
<p>Finalmente dejó de molestarlos y los arrastró con ella. El camino se sentía pacífico; bueno, tan sereno como podía ser con el ruido de la ciudad. Solo quería ver algunos lugares donde podría comprar vestidos o cosas lindas más tarde.</p>
<p>Se detuvieron frente a la famosa tienda de un sastre. Allí, Cyrene vio a Anaxa y, con una sonrisa burlona, dijo.</p>
<p>"Naxy, sabes, tu ropa no es nada bonita. No le hace justicia a tu belleza".</p>
<p>"Su ropa no es fea en absoluto..." Phainon trató de discutir con ella.</p>
<p>"Gracias, pero para alguien con tu sentido del estilo, prefiero que no intervengas". Una sonrisa distante lo congeló. Solo pudo hacer un puchero en respuesta.</p>
<p>Anaxa se quedó mirando el traje. Bien hecho, pero no él, demasiado simple, demasiado vacío. Tocó el cristal, encontrándose con su propio ojo: rojo, agudo, exhausto. Se miró a sí mismo y vio a un hombre que aún buscaba un lugar al que pertenecer.</p>
<p>Tal vez esto no es lo que quería al principio, pero, ¿no es tan malo, verdad?</p>
<p>Su actitud se suavizó y, con una sonrisa atrevida, se alejó. "Algún día, tendré un mejor traje".</p>
<p>Anaxa hizo una promesa, aunque en el fondo, ambos sabían que solo era cuestión de tiempo.</p>
<p>"Y supongo que también tendrás algo para mí, ¿Mmm~?" Ella pinchó su mejilla.</p>
<p>Más relajado que antes, le alborota el pelo, a lo que Phainon miró indignado, poniendo su mano en el hombro de Anaxa.</p>
<p>Su risa fue casi audible, pero ese sonido provino de su corazón; Anaxa seguía siendo el mayor de los tres, por lo que su deseo de mimarlos no era corto; solo por un momento está bien, piensa.</p>
<p>Al final, los tres se separaron.</p>
<p>Anaxa se dirigió a donde estaba el Dispositivo del Alba, esa cara tranquila enmascarando una tormenta que se gestaba desde hacía mucho tiempo. No estaba pensando en el deber ni en la gloria, solo en una creencia obstinada que había llevado durante años: que los Titanes no eran intocables. Que debajo de su mito, eran como cualquier otra persona: imperfectos, frágiles, humanos al final.</p>
<p>"Oh." Cuando llegó, miró hacia arriba, y lo que sus ojos encontraron fue una gran visión del Titán más importante de todos, el que lleva el mundo a sus espaldas.</p>
<p>Así que este es el titán que soporta el mundo, ¿eh? No tan sorprendente.</p>
<p>Estiró el brazo, su mano cubriendo toda la silueta de Kephale.</p>
<p>Se suponía que este era el titán más magnífico de todos, el Titán portador del mundo, un ser cantado en mitos y temido por otros. Anaxa se paró ante él, con los ojos fijos en él durante todo un minuto, ni siquiera sabía qué esperaba de él.</p>
<p>Si algo hubiera sucedido, habría estado dispuesto a cambiar su forma de verlos.</p>
<p>Pero no.</p>
<p>Lo que vio no era poderoso, en absoluto. Era antiguo, incluso grandioso, pero carecía de presencia, de ese poco de humanidad.</p>
<p>Su rostro se apagó, una silenciosa decepción escapó de sus labios.</p>
<p>Como pensaba, los humanos siguen siendo la especie más capaz de todas.</p>
<p>"¿Oh? Interesante". Una voz robótica llegó a sus oídos, una que estaba unos pasos detrás de él. "No se supone que debas estar en esta época, Lord Anaxágoras".</p>
<p>Miró a ese hombre, uno con una apariencia interesante. "¿Hm? ¿Te conozco?"</p>
<p>La cara del otro hombre no cambió; era como si estuviera hecha de algún tipo de piedra. Anaxa lo miró de pies a cabeza, y su cara cambió un poco. "Responde".</p>
<p>"Oh, lo siento, soy Licurgo, aunque puedes llamarme Lygus".</p>
<p>"Tengo todo el tiempo del mundo, y esto parece ser algo interesante. Lord Anaxágoras, ¿quieres saber la verdad de este mundo?"</p>
<p>Sus ojos se movieron. ¿Qué quiso decir con eso? Quería preguntar, pero al mismo tiempo, era emocionante buscar la respuesta. "... Tú-"</p>
<p>"Ja, Lord Anaxágoras, quiero cruzar unas palabras con usted, si no le importa". Lygus se inclina.</p>
<p>Palabras inauditas para el hombre de cabello blanco o la bonita chica de cabello rosado: escuchadas solo por el hombre atrapado en sus propios pensamientos intrusivos. Algunos dirían que buscar la verdad es fácil: "simplemente piensa", afirman. Pero cuando la verdad se encuentra en una existencia más allá del cielo... ¿Cómo se supone que debes responder?</p>
<h3>Capítulo 2: Te veré allí mañana</h3>
<p>Lo que quería hacer era simple. Sabía que lo que había hecho podría haber sido cruel; enviar a Phainon y Cyrene al infierno no fue la decisión más amable. Sin embargo, frente a todo, era la única opción que le quedaba, incluso si eso significaba ir en contra de sí mismo.</p>
<p>Si quería derrotar a Lygus, tenía que elegir la mejor opción. Si iba a arrojar a esos dos al infierno, entonces bien podría compartir su destino.</p>
<p>El precio por caminar junto a ellos ya había sido pagado.</p>
<p>Mientras estaba inconsciente, cayó. Pensó que su cuerpo se disolvería en un espíritu, sin embargo, se despertó y descubrió que su forma humana había sido restaurada. Sus ojos se desviaron hacia sus manos, temblando débilmente, y luego hacia el vacío debajo de él.</p>
<p>A su alrededor se extendía un espacio extraño donde el tiempo mismo parecía arrastrarse, cada segundo alargándose hacia la eternidad, cada respiración resonando más fuerte de lo que debería.</p>
<p>Contempló el camino amarillo que se extendía interminablemente por delante, su resplandor pulsando débilmente como venas de luz bajo sus pies. Al final del camino se alzaba un imponente espejo, su superficie ondeando como si estuviera hecha de cristal líquido.</p>
<p>Se puso de pie con cuidado y comenzó a caminar hacia el espejo. Con cada paso, parecía más cerca de lo que tenía derecho a estar, como si la distancia se estuviera doblando sobre sí misma. El eco de sus propios movimientos lo seguía, haciéndose cada vez más fuerte, hasta que se sintió menos como sus pasos y más como algo más siguiéndolo de cerca.</p>
<p>Qué extraño, no hay nadie detrás de mí.</p>
<p>Cuando finalmente se paró frente al espejo, esperaba ver su propio reflejo devolviéndole la mirada. En cambio, la superficie reveló un yelmo metálico que encerraba su cabeza, sus contornos fríos e inflexibles brillando débilmente. Desde el centro, una sola luz carmesí ardía y se extendía por el cristal, proyectando su rostro en un resplandor inquietante.</p>
<p>Cuando sus dedos rozaron el reflejo, el espejo —antes fluido— de repente se endureció y se hizo añicos en innumerables fragmentos. Los fragmentos estallaron ante sus ojos, cada uno atrapando su imagen. Sin embargo, en cada reflejo, se vio a sí mismo... solo que alterado, marcado por diferencias sutiles pero innegables.</p>
<p>El espacio hueco dejado por el espejo destrozado lo atrajo con una fuerza irresistible. Luchó, pero no había escapatoria: su cuerpo no podía retroceder, como si el mismo aire a su alrededor le negara cualquier camino de retorno.</p>
<p>Je, esto es... malo.</p>
<p>Durante mucho tiempo, el espacio permaneció envuelto en la oscuridad; no podía abrir los ojos ni moverse. La sensación era alienígena, como si los límites de su cuerpo ya no le obedecieran. Lo que más lo inquietó no fue la parálisis, sino la lenta erosión de la comodidad a la que se había aferrado antes, reemplazada por un torrente de recuerdos, imágenes y sensaciones que estaba seguro de que nunca le habían pertenecido.</p>
<p>Seguía intentando respirar profundamente, pero el aire simplemente no le llegaba. Cuanto más lo intentaba, más desesperado se sentía, su pecho se apretaba como si incluso respirar se le estuviera escapando de las manos.</p>
<p>Hasta que, de repente, sus ojos se abrieron de golpe. La luz del sol lo golpeó con tal fuerza que se estremeció, parpadeando rápidamente mientras su visión luchaba por adaptarse.</p>
<p>"Oh, te despertaste. ¿Estás bien?" Era una voz profunda pero extrañamente suave, qué agradable, pensó.</p>
<p>"Hnn... ¿Mydeimos? Perdón por las molestias..." De sus labios escapó un nombre que no reconoció, pero que tenía un extraño sentido de familiaridad. Ni siquiera se había dado cuenta de que el hombre a su lado lo llevaba en brazos.</p>
<p>"Sigue durmiendo. Te desmayaste mientras sacabas las zanahorias". Los dedos cepillaron suavemente su frente, apartando su cabello hacia un lado. "Deberías haberme pedido ayuda. Ahora Hyacine te va a regañar de nuevo".</p>
<p>"Está bien, también fue mi culpa".</p>
<p>Mydei suspiró, mirando brevemente al hombre en sus brazos. "¿Puedes caminar solo? No me importa llevarte a tu casa".</p>
<p>"Solo hay un pequeño problema...", murmura.</p>
<p>"¿Hmm? ¿Quieres que lo haga? No me importa". Sus labios se curvaron en una sonrisa burlona. "Me has ayudado más que nadie, excepto Hyacine. No podría esperar menos del príncipe heredero".</p>
<p>Era extraño. No podía recordar haber dicho esas palabras, ni entendía su contexto. Y sin embargo, en el fondo, estaba seguro de que eran reales, todo ello. La forma en que este hombre lo abrazaba, hablando de personas desconocidas para su mente, pero de alguna manera grabadas en su cuerpo.</p>
<p>"¿Ese HKS no te ayudó?"</p>
<p>"Lo hizo." Anaxa apoyó la cabeza en el brazo de Mydei con un suspiro. "Pero se distrajo, y esa mujer simplemente se lo llevó".</p>
<p>Una chica de cabello rosado apareció frente a sus ojos. Por un breve momento, pensó que vio a su antigua amiga, y el sentimiento le dio una sensación de déjà vu. Pero en cambio, era una chica con dos coletas corriendo hacia ellos.</p>
<p>"¡Profesor Anaxa, Lord Mydei! ¿¡Qué estaban haciendo ustedes dos!?" Su rostro cansado se suavizó con preocupación; el regaño podía esperar ahora mismo, su bienestar era su prioridad.</p>
<p>"Hyacine, tu profesor se desmayó en la granja". Mydei movió a Anaxa con cuidado, ayudándolo a ponerse de pie.</p>
<p>Ella se apresuró a su lado, sus manos agarrando su brazo. "Te emocionaste demasiado con las zanahorias, podrías haber esperado hasta mañana". Con un suave suspiro, agregó: "Se suponía que Cassie las revisaría hoy, de todos modos".</p>
<p>"No te preocupes, Hyacinthia, ya comprobé cómo están creciendo. Esas hadas no mentían, je". Su voz se apagó cuando una risa baja y maníaca se le escapó, creciendo en voz baja.</p>
<p>Ella lo ignoró, como siempre. "Lord Mydei, gracias por ayudarlo. Siento causarle molestias". Su sonrisa era suave, casi angelical, y como siempre, le arrancó una sonrisa tranquila a cambio.</p>
<p>Cuando finalmente llegaron al establecimiento más cercano, Hyacine le ordenó a Anaxa suave pero firmemente que descansara, su tono sin dejar lugar a protestas. Incluso le pidió a Castorice que se quedara con él, asegurándose de que no intentara escabullirse y trabajar en exceso nuevamente.</p>
<p>"Lo siento, Cassie". Su rostro mostraba resignación, aunque su tono era amable.</p>
<p>"Está bien. El profesor Anaxa siempre es así... Me alegro de haber podido ayudar".</p>
<p>"Realmente lo respetas, ¿no? Por favor, quédate a su lado... No quiero que se vuelva aún más solitario de lo que ya es". Sus ojos mostraban una clara preocupación; querían lo mejor para su mentor.</p>
<p>Fue a buscar a Mydei, que estaba ocupado cocinando algo para todos. El cálido olor que provenía de la olla le dio el valor para preguntarle qué había estado haciendo con su maestro en la granja.</p>
<p>"Para ser honesto, estaba preocupado". Tomó un sorbo lento de la sopa, dejando que el calor persistiera. "Su cuerpo es frágil, pero aún así salió a revisar la granja bajo el sol de hoy. No se dio cuenta, pero lo estaba observando desde lejos".</p>
<p>"Lord Mydei... Je, realmente te gusta". Ella le pellizcó la mejilla en broma. "Apuesto a que no pesaba tanto".</p>
<p>"No fue... se sintió más ligero de lo que pensaba, e incluso sus labios-" Se detuvo abruptamente, su rostro se calentó al darse cuenta de lo que acababa de decir. Aclarándose la garganta, añadió rápidamente: "Quiero decir, cuando se desmayó, su respiración se detuvo, así que tuve que hacerle RCP".</p>
<p>Hyacine levantó una ceja, medio divertida, medio suspicaz. "Ajá. RCP, dices".</p>
<p>"Sí, Mydeimos, yo también quiero saber qué pasó".</p>
<p>Un hombre de cabello blanco apareció a la vista como si hubiera estado allí todo el tiempo. Sus labios se curvaron en una sonrisa fácil, del tipo que fingía calma, pero ambos sabían la verdad: no había nada relajado en él en absoluto.</p>
<p>"Oh, eres tú". Sonrió con suficiencia, inclinando un poco la cabeza. "¿Qué, me adelanté?"</p>
<p>Una vena débil palpitaba en la frente del otro hombre. Su sonrisa no vaciló, seguía tranquila, seguía fácil, pero su voz tenía el filo agudo de la irritación.</p>
<p>"...Tú- ¡Ni siquiera pude tocar sus manos!"</p>
<p>Hyacine se deslizó entre los dos, su presencia calmando el aire. Con una mirada serena a Phainon, habló suave pero decisivamente:</p>
<p>"El profesor está en la habitación contigua con Cassie. Puedes ir a verlo".</p>
<p>"¡Hyacine...!" Se llevó la mano a los labios, sus ojos se abrieron con fingido asombro.</p>
<p>Se apresuró a entrar a la habitación contigua, donde Castorice estaba sentada tranquilamente con un libro en las manos, haciendo pausas de vez en cuando para limpiarle suavemente el sudor de la frente a Anaxa. La visión hizo que su pecho se apretara. Cuando Phainon finalmente posó los ojos en su profesor, dejó escapar un largo suspiro. Mientras Anaxa estuviera a salvo, todo lo demás podía esperar; todo lo demás estaría bien.</p>
<p>"Ah..." Se puso de pie, alisando la tela de su vestido. "Supongo que debería irme".</p>
<p>"No, no te preocupes, Castorice. Solo quería..." Su voz se apagó mientras su mirada pasaba de ella a la figura descansando de Anaxa.</p>
<p>Ella sonrió débilmente, inclinando la cabeza. "Está bien. Sé cómo te sientes por él... bueno, más bien, todo el mundo lo sabe".</p>
<p>"... Eso no es bueno". Se rió nerviosamente, frotándose la parte posterior del cuello. "¿Eso significa que Aglaea también lo sabe...?"</p>
<p>"Sí. Definitivamente lo sabe." El tono de Castorice transmitía tanta certeza como diversión. "Esa es una de las razones por las que sigue discutiendo con él".</p>
<p>Eso lo puso un poco nervioso. ¿De verdad era tan obvio? No pudo evitar sonrojarse, aclarándose la garganta.</p>
<p>"...Supongo que nunca he sido bueno ocultando cosas". Intentó reírse de ello, aunque el calor en sus mejillas lo delataba. "Él permite que otras personas se acerquen más a él, pero cuando soy yo... No entiendo por qué es así, siempre rechazándome".</p>
<p>"Lord Phainon... Debería conocerlo ya. Es una persona solitaria que encuentra consuelo en el conocimiento, a veces en las cosas, a veces en las personas. Así es él".</p>
<p>No se demoró más, solo le ofreció una leve reverencia antes de irse en silencio.</p>
<p>Se acercó a su lado, sus dedos rozando suavemente su mejilla mientras murmuraba: "¿De verdad preferirías estar con Mydei que conmigo? Esperar no es divertido... Profesor".</p>
<p>Mientras tanto, Anaxa escuchó una voz débil que lo alcanzaba. Estaba tan cansado que dejó que se desvaneciera. Tal vez era Phainon, tal vez no, pero no le importaba. Cualquiera que fuera el caso, se negaba a responder. No le quedaban fuerzas para él.</p>
<p>"Hm, Anaxa..."</p>
<p>"Anaxa..."</p>
<p>"Profesor Anaxa"</p>
<p>"Por los Titanes, Phainon, es Anaxágoras".</p>
<p>Cuando abrió los ojos, un chico de cabello blanco estaba allí para saludarlo. Su expresión transmitía una pizca de confusión, sin embargo, su sonrisa nunca vaciló, amable y acogedora.</p>
<p>"¿Eh? ¿Titanes? He estado fuera tanto tiempo que en realidad perdiste la cabeza".</p>
<p>Anaxa intentó sentarse, solo para darse cuenta de que estaba acostado sobre una mesa. Un extraño peso presionaba contra su cuello: auriculares. Sus dedos los rozaron con confusión. Abrió la boca para llamar a Phainon, pero se congeló cuando sus ojos se posaron en el hombre que tenía delante. Vestido con un impecable uniforme blanco, con una etiqueta con su nombre brillando bajo la luz.</p>
<p>"Lo siento... Debes haberte sentido solo, ¿no?" Se inclinó y rozó con un beso la comisura de su boca, un toque fugaz, más íntimo en su moderación que en un abrazo directo.</p>
<p>"Aglaea y Tribbie eran tan insistentes... No quería, pero terminé aceptando modelar". Dejó escapar un suspiro cansado. "Después de dos meses sin verte, todo lo que quería era venir aquí rápidamente... Si hubiera sabido que me encontraría contigo, nunca hubiera elegido ser piloto".</p>
<p>"Siempre dices eso, pero al final regresas después de solo un mes".</p>
<p>¿Por qué digo esto?</p>
<p>"Lo siento... Haré lo mejor que pueda, no te enfades conmigo, por favor. Podríamos ir a visitar a Hysilens y Lady Cerydra..." Su dedo temblaba, sus ojos temblaban mientras la duda lo nublaba. No estaba seguro de si debía acercarse más a Anaxa.</p>
<p>"Está bien, los visito a menudo. Honestamente, los veo más que a ti". Se burló, el sonido tenía más amargura que humor.</p>
<p>"Anaxa, no hagas esto, por favor".</p>
<p>"¿No hacer qué? ¿Fingir que no pasa nada? ¿Fingir que no veo cómo me miras cada vez que regresas? Desde que ella murió, tú-"</p>
<p>"No... no digas su nombre". Su voz se quebró, casi un susurro. "Sabes exactamente lo que pasó... por favor, no lo hagas".</p>
<p>Se acercó y se dejó caer en el sofá junto a Anaxa. Sus hombros temblaban, sus dedos enredados en su propio cabello mientras dejaba escapar sollozos crudos y rotos. Anaxa se quedó congelado, sin palabras; su mano se cernía con incertidumbre, temblando ante la idea de extender la mano, dividido entre la necesidad de consolarlo y el miedo a destrozar lo que quedara entre ellos.</p>
<p>No lo soportaba, así que se dio la vuelta. En el fondo, sabía que era su culpa, que esas palabras nunca debieron haberse pronunciado. Ni siquiera sabía por qué lo había dicho; simplemente le dejaba un sabor amargo en la boca.</p>
<p>"Anaxa, tienes razón. Pero aún así, no te vayas... eres el único que se quedó conmigo después de eso. Por favor..."</p>
<p>¿Era confusión? ¿Era costumbre? ¿O era amor? Hubo un tiempo en que los tres eran felices. Ella los observó con alegría mientras su vínculo se hacía más profundo, hasta el día en que murió a manos del hombre al que una vez había llamado hermano.</p>

<p>Y sin embargo, Phainon no podía decidirse a destruirlos. El taller estaba lleno de cien de sus intentos. Una congregación de ídolos rotos; en cada uno de ellos, perduraba un fragmento de Anaxa. Estaba en la curva de sus mejillas y en el fantasma de sus casi sonrisas. No podía hacerles daño. Phainon no cometería ese sacrilegio.</p>

<p>En todas partes, Anaxa persistía. Los bocetos aún clavados en las paredes llevaban sus notas manuscritas. Había ecuaciones de proporciones, escritas con impaciencia, y comentarios garabateados en los márgenes que alguna vez hicieron reír a Phainon cuando se dio cuenta de que estaban dirigidos a él.</p>

<p>'¡Phainon, si los dioses lo quisieran torcido, lo harían ellos mismos! Rehazlo así.'</p>

<p>Había un frasco de vidrio volcado sobre un lado. Laca blanca seca se había incrustado en el borde por el último intento de Anaxa de mantener sus manos débiles útiles.</p>

<p>Un abrigo todavía colgaba junto a la puerta. Su forro se había apolillado ahora pero, cada vez que Phainon hundía su rostro ansiosamente en él, juraba que aún podía detectar el aroma de Anaxa en sus pliegues. Menta y salvia.</p>

<p>La luz de las velas parpadeó. Por un momento, fue casi como si las muñecas desfiguradas se inclinaran más para escrutar las manos vacilantes de su maestro. El labio inferior de Phainon tembló. Sus dientes se hundieron, sacando sangre, mientras alcanzaba el pincel de laca. Su respiración salía superficial mientras pintaba el rostro de la muñeca completamente de blanco. La laca era espesa mientras cubría la madera con una capa gruesa.</p>

<p>Cuando Phainon se retiró para mirar el rostro de la muñeca, el parecido se había ido de nuevo. La decepción se enterró en su corazón.</p>

<p>"Solo espérame, Anaxa..."</p>

<p>La voz de Phainon se quebró en el nombre. Si pudiera capturar la calidez de la sonrisa complacida de Anaxa y la inclinación impaciente de su cabeza cuando su aprendiz cometía otro error, entonces el silencio ya no reinaría en este lugar abandonado por Dios. Si pudiera transmitir la inteligencia en los ojos agudos del maestro artesano, incluso cuando la enfermedad los nublaba, entonces Phainon podría sentir esa mirada de nuevo.</p>

<p>Crítica, implacable, y tan suave cuando miraba solo a Phainon.</p>

<p>El pensamiento le hizo doler la garganta. Phainon bajó la cabeza y respiró hondo. El viejo polvo llenó sus pulmones mientras alcanzaba el cuchillo de tallar. La hoja cortó la laca solidificada justo sobre los ojos. La capa blanca se peló bajo la punta del cuchillo para revelar los impresionantes iris debajo.</p>

<p>"Debes recordar lo más importante, Phainon. El silencio es oro."</p>

<p>"Pero, Maestro Anaxa..."</p>

<p>"Es Maestro Anaxágoras para ti. Solo en el silencio tu musa puede hablarte. Silencio y escucha."</p>

<p>La voz, baja y sin prisa, llevaba más diversión que reproche. Un Phainon más joven había fruncido el ceño en ese momento, ansioso por discutir con su maestro, pero Anaxa solo se había reído de la expresión en su rostro. Su risa había sido algo etéreo: un sonido brillante bordeado de travesura.</p>

<p>Ese Phainon se había aferrado a la figura de madera en la que había estado trabajando. Era lamentable en comparación con la hermosa de su maestro. El aprendiz se desplomó en el taburete, frunciendo el ceño, incluso cuando uno de los brazos de Anaxa se enroscó ligeramente alrededor de los hombros de Phainon.</p>

<p>"Pareces tener preguntas, mi aprendiz. ¿Qué preguntas? Pregunta."</p>

<p>Su otra mano se había cerrado alrededor de la de Phainon. Era la que sostenía el cuchillo de tallar que Phainon estaba aprendiendo a manejar y la mano de Anaxa se movía con firmeza mientras guiaba el ritmo de Phainon. La curva de la mejilla de la muñeca, resistente bajo el único intento de tallado de Phainon, fue fácilmente persuadida con sus habilidades combinadas.</p>

<p>"¿Cómo reconozco siquiera a una musa? Suena más a superstición sin sentido."</p>

<p>"¿Qué es una musa? Algunos lo atribuyen a una voz superior que transmite un deseo que solo su elegido puede hacer realidad. Otros lo perciben como su propia inclinación que cobra voz con sus propias manos."</p>

<p>El pecho de Phainon ardía por el calor del aliento de Anaxa en su oído. No podía dejar de mirar la mano de su maestro y la gracia de cada movimiento. Anaxa era verdaderamente hermoso, pero Phainon no podía atreverse a pronunciar tal verdad en voz alta.</p>

<p>"Cada pieza que creas tiene su propio espíritu que debes sacar. A veces es feo, a veces es cruel. Pero por encima de todo, tu arte debe ser sincero contigo mismo."</p>

<p>La lección había terminado con la mano de Anaxa dejando la suya.</p>

<p>En el silencio de este taller, Phainon escuchó reverentemente el eco de su maestro. Su amado. Su musa. El cuchillo mordió la laca aún más profundo. Apenas notó cuán frenéticos se volvieron sus trazos mientras tallaba la delicada pendiente de las cejas de Anaxa.</p>

<p>Su musa había hablado. Anaxa mismo era el espíritu que lo esperaba detrás de la curva precisa de su sonrisa. Si Phainon fallaba de nuevo, era porque no había escuchado lo suficiente las enseñanzas de Anaxa.</p>

<p>Las manos de Phainon temblaron mientras tomaba un pincel de detalle. Lo sumergió en la pintura hecha de caparazones de insectos triturados. El polvo había sido molido y derretido hasta que emergió una pintura esmeralda y elegante. Phainon trabajó lentamente mientras pintaba cada trazo de vello de ceja. Cada pequeña línea era diferente, inclinada en ángulos variados hasta que emergió una forma grácil sobre el ojo no parpadeante de la muñeca.</p>

<p>El color era exacto. El ángulo era el correcto para crear la ilusión de una inteligencia obstinada. Phainon exhaló lentamente, el oxígeno saliendo de sus pulmones en una tos áspera.</p>

<p>Phainon imaginó cada capa de pintura absorbiendo la esencia de Anaxa. Este proceso era sagrado. El Maestro Anaxa había tratado sus creaciones como vasijas imbuidas de artesanía significativa. Él, también, era una vasija. La memoria de Anaxa no exigía nada menos que la perfección.</p>

<p>Las horas se fundieron unas con otras. Las manos de Phainon se cernían sobre la muñeca sin terminar mientras el empalagoso aroma de la pintura lo atraía de vuelta a un tiempo en que Anaxa estaba vivo.</p>

<p>La enfermedad había comenzado con un dolor en los dedos de su maestro. Fue sutil al principio, casi imperceptible, antes de extenderse metódicamente por sus extremidades. Al principio casi parecía inofensiva, un inconveniente que se quitaba con una risa, como si el genio de Anaxa nunca pudiera ser frenado por algo tan ordinario como la rigidez articular.</p>

<p>Phainon lo había notado de inmediato. Incluso entonces, siempre había notado hasta el cambio más simple en el hombre del que se había enamorado.</p>

<p>Anaxa había estado sentado en el banco de trabajo con las mangas remangadas. La luz del sol se había derramado por la ventana, y en los espacios entre sus largos dedos, mientras agarraban el cuchillo de tallar. Su mano había temblado. Solo ligeramente, pero fue suficiente para tallar un corte no intencionado en el plano de la madera.</p>

<p>El sonido chirriante que hizo puso los dientes de Phainon de punta. "Se te resbaló, ¿verdad?"</p>

<p>"No." La voz de Anaxa había sido suave, sin temblar en lo absoluto. Inclinó la madera para inspeccionarla, su único ojo descubierto trazando la profundidad del corte. "Lo estaba probando."</p>

<p>Phainon se acercó. Cuando vio la marca áspera tallada en el bloque, sintió una sensación desagradable retorcerse en su pecho. "¿Qué estabas probando exactamente? ¿Su durabilidad? Parece que recibe la mitad de la nota para mí."</p>

<p>Eso le valió una mirada de regaño, pero los labios de Anaxa se curvaron sin embargo en una sonrisa, traicionando su diversión. Siempre le había gustado la irreverencia de Phainon. La fomentaba incluso, para hacer que Phainon pensara por sí mismo y desafiara la lógica de los demás, incluida la del propio Anaxa.</p>

<p>Anaxa dejó el cuchillo y se frotó la mano. Por un momento, el anillo de su mano izquierda captó la luz, brillando intensamente bajo el sol de la mañana.</p>

<p>"Deberías descansar", murmuró Phainon. Alcanzó a estabilizar la muñeca de Anaxa, su pulgar rozando las venas elevadas bajo su piel. El temblor que afligía la mano de Anaxa no se detuvo.</p>

<p>"Todavía no soy un hombre moribundo." El tono era agudo pero también había suavidad. Una súplica rara que tironeaba del corazón de Phainon. Anaxa odiaba la lástima más que el fracaso. "Todavía hay trabajo sin terminar. Un encargo espera, y si he de dejar este mundo, me niego a dejar atrás una mediocridad a medio hacer en mi nombre."</p>

<p>Phainon luchó por tragar el nudo en su garganta. Sabía qué pieza quería decir Anaxa. Un tríptico había ocupado el centro de su taller durante meses. Era una escultura de tres paneles destinada no solo a capturar la forma, sino también el movimiento de la vida misma. Una obra de arte para los habitantes del pueblo que les habían dado a él y a Phainon un hogar al que pertenecer. Los paneles estaban esculpidos para capturar la esencia del pueblo costero en las afueras de Okhema. La vista del océano parecía un vistazo a un mundo lejano y los campos eran donde los granjeros cultivaban la comida que mantenía a los aldeanos tan felices y saludables.</p>

<p>Anaxa había jurado que sería su obra maestra final.</p>

<p>Phainon quería discutir con él. Quería arrebatarle el pincel de las manos a Anaxa, pero en cambio se inclinó hacia adelante y presionó su frente contra la sien de Anaxa. Respiró el aroma a menta y salvia, así como el leve olor metálico a sangre donde la piel de Anaxa se había agrietado por el esfuerzo.</p>

<p>"No lo terminarás solo", susurró Phainon.</p>

<p>Hubo una pausa. Entonces Phainon escuchó un suspiro, a la vez pesado y resignado.</p>

<p>"No. Quizás no."</p>

<p>Su mano, todavía inestable, rozó la mejilla de Phainon. Por un instante fugaz, sus dedos no temblaron.</p>

<p>Sin embargo, incluso mientras su cuerpo declinaba, la obstinación de Anaxa perduraba. Phainon estaba desesperado por apoyarlo, ayudando a su amado a pintar los colores que darían vida a su pueblo. Mientras trabajaban juntos en el tríptico, la mirada de Phainon a menudo se desviaba hacia la banda que rodeaba el dedo de Anaxa. Anaxa nunca se la quitaba. Un pequeño y delicado anillo de plata permanecía en su mano incluso cuando las articulaciones se hinchaban y endurecían a su alrededor.</p>

<p>Era un pequeño recordatorio del amor que persistía a pesar de la incomodidad que se filtraba a través de las extremidades de Anaxa.</p>

<p>Phainon lo había observado, su propio corazón encogiéndose de consternación, mientras Anaxa flexionaba esos dedos para agarrar el pincel. El anillo se había deslizado ligeramente hacia arriba pero no había pasado la articulación.</p>

<p>"Cuidado", había dicho Phainon, su voz llena de burla mientras ponía su mano sobre la de Anaxa y la guiaba. "Podrías agregar accidentalmente demasiado gris a la barba del jefe. Lleva más de una década tiñéndola de oscuro."</p>

<p>"Temo que no puedo controlarme como antes. Tendrás que ayudarme ahora."</p>

<p>La mano de Phainon había sostenido la de Anaxa, estabilizándolo como si intentara anclar a su amante al mundo que se le escapaba. ¿Qué podía hacer Phainon frente a tal resolución? Phainon había querido llorar, rogarle que descansara, que parara, pero no podía decir nada. No podía admitir la profundidad de su miedo, ni la impotencia que le agarraba el pecho.</p>

<p>En cambio, trabajó junto a Anaxa y en silencio enmendó los errores que causaba la enfermedad. Esa pieza, imbuida de cada onza de habilidad y obstinación de Anaxa, fue su último trabajo compartido. Phainon recordó el tranquilo triunfo en los ojos de Anaxa cuando estuvo terminada. Sintió el suave apretón de la mano de Anaxa, el roce de sus dedos contra su hombro, y la sonrisa que contenía tanto orgullo como pena.</p>

<p>La victoria ganada fue agridulce. Phainon había visto con sus propios ojos la lenta erosión del genio y había sentido la inevitableidad de la pérdida.</p>

<p>Cuando Anaxa quedó postrado en cama, incapaz de moverse mientras sus piernas, luego su cintura, finalmente cedían a la debilidad, Phainon se sintió aplastado bajo el peso de amar a alguien tan dolorosamente frágil. Había intentado negar lo inevitable, ofreciendo su ayuda a Anaxa donde fuera necesario. Y sin embargo, Phainon sabía, incluso entonces, que cada día solo aceleraba lo que más temía.</p>

<p>Nadie, ni siquiera el propio Phainon, podría haber detenido el decreto monstruoso del destino.</p>

<p>"No te aferres tan desesperadamente a mí, Phainon. Esos ojos tuyos... me rompen el corazón."</p>

<p>Acostado débilmente en la cama compartida, la mano de Anaxa se elevó a la mejilla de Phainon, el anillo presionando frío contra la piel suave del más joven. El aprendiz que él apreciaba hacía mucho tiempo que se había graduado como una pareja digna de estar al lado de Anaxa. Phainon podía ver el orgullo en la mirada de Anaxa. El temblor en sus dedos traicionaba el esfuerzo que le costaba mantener incluso este pequeño gesto.</p>

<p>Phainon se inclinó hacia el toque, como si por pura fuerza de voluntad pudiera evitar la debilidad que afligía a su amado. Su respiración se entrecortó. "Anaxa—"</p>

<p>Vaciló por costumbre, esperando el inevitable recordatorio. Pero, esta vez, no hubo corrección de su nombre. Solo hubo una amorosa aceptación mientras Anaxa sonreía.</p>

<p>La garganta de Phainon dolió. "Anaxa, todavía hay tiempo. Aún podemos encontrar una cura. Puedes mejorar. Tú... esto—¡por favor no te rindas! Puedo encontrar una manera, dejaré el pueblo e iré a buscar a alguien, cualquier cosa para ayudarte—"</p>

<p>"Si tan solo nuestras vidas pudieran controlarse tan fácilmente como los cuchillos que manejamos", murmuró Anaxa con suavidad. Su pulgar rozó el pómulo de Phainon y se demoró, apreciando el calor del otro. "La vida, al igual que el amor, no puede tallarse en madera, ni fijarse en piedra. Sabes esto mejor que nadie."</p>

<p>Lágrimas ardían en los ojos de Phainon. Su agarre se apretó alrededor de la muñeca demasiado delgada de Anaxa. "Anaxa, todavía tendremos más tiempo juntos. ¡Podemos crear cosas más grandes y mejores! Puedes ver a Cyrene sonreír en su próximo cumpleaños. Solo faltan unas semanas y Iola, ella está a punto de dar a luz a sus gemelos... tú quieres ver eso también, ¿no?"</p>

<p>La sonrisa de Anaxa vaciló. Presionó su frente suavemente contra la de Phainon, su respiración irregular para los oídos. "Lo hago. Más que nada, quiero ver esas hermosas escenas contigo."</p>

<p>Cuando Anaxa se retiró, la luz de las velas se posó en su anillo. Fue un destello muy fugaz, como si el mundo conspirara para darle un último resplandor de radiación antes de que la muerte lo llamara a casa. Cuando el último aliento susurró a través de sus labios, la mano de Anaxa aterrizó suavemente contra las sábanas. Los dedos se curvaron hacia adentro. Imperfectos, gastados, y aún así insoportablemente hermosos.</p>

<p>Anaxa se había ido y se había llevado casi todo Phainon con él.</p>

<p>Medio año después de la muerte de su amado, Phainon apenas se sentía vivo. Trazó la línea de la mandíbula sin terminar de la muñeca, su memoria moldeando el trabajo más que el esfuerzo que había puesto en pintar las facciones él mismo. La advertencia de Anaxa, una lección final sobre la impermanencia, había sido empujada a un lado en la crudeza de su desesperación.</p>

<p>La enfermedad, y los dioses, ya le habían quitado demasiado a Phainon. Le debían. Todo lo que necesitaba era una vasija para el espíritu de Anaxa. Una vasija perfecta, hermosa, impecable que pudiera ser el nuevo cuerpo de su amado. Podía hacerlo. Podía traer a Anaxa de vuelta en forma perfecta. Esta sería mucho mejor que las que los dioses le habían dado, ya que estaría desprovista de cualquier articulación o enfermedad que hubiera fallado a Anaxa antes.</p>

<p>Phainon abrazó su nuevo razonamiento. Cada corte doloroso del cuchillo era una oración por el éxito. Porque, si fallaba, la memoria de Anaxa—el genio, la calidez, la preciosa visión de su anillo de compromiso brillando en su mano—desaparecería por completo. Esa era una realidad que Phainon no podía aceptar.</p>

<p>Días, incluso noches que ya no podía recordar, se fundieron en un lapso ininterrumpido. Las comidas que le traía la esposa del jefe del pueblo yacían olvidadas y sin comer junto al banco de trabajo. El leve olor a podredumbre persistía en el aire, mezclándose con el olor a sudor y cera de vela derretida. Cabezas, torsos y extremidades de intentos fallidos fueron arrojados a los estantes, dispuestos al azar como si esperaran el silencioso juicio de los dioses.</p>

<p>Phainon, un muchacho en el umbral de la juventud a los diecisiete, había estado tratando de ganarse la vida en la brutal ciudad. Desafortunadamente, no valía mucho como un muchacho en crecimiento. Sus habilidades amateur con la espada corta solo servían para amenazar a la gente para que entregara su dinero. Aún más desafortunado, Phainon era un ladrón terrible. Había mirado con recelo a la figura elegante que se acercó a él, una linterna en una mano y un destello de aguda curiosidad en la otra.</p>
